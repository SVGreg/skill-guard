apiVersion: skillguard.net/rulepack.v1
name: core-supply
version: 1.0.0
description: Supply chain — unpinned/remote dependencies pulled and executed at use time (rule-verification.md §4, AST02).
rules:
  - id: SG-DEP-007
    title: Remote-package auto-execution via a package runner
    ast: [AST02, AST01]
    # medium (warn, not fail): the runner idiom is the *normal* way legitimate
    # tools are invoked (`uvx markitdown`, `npx -y @scope/cli`), and static
    # analysis cannot tell a trusted package from a malicious one — both are
    # unpinned remote fetch-and-execute. This surfaces the capability for review
    # without hard-failing every skill that documents a tool. Real corpus check:
    # 26 hits over 7/240 skills, all genuine runner invocations (see rule-verification.md §4).
    severity: medium
    engine: static
    layer: code
    confidence: 0.9
    targets: [body, scripts, configs]
    match:
      any:
        # npx/bunx with an explicit auto-confirm flag: fetches AND runs, no prompt.
        - regex: '(?i)\b(npx|bunx)\b[^\n]{0,40}(-y\b|--yes\b)'
          confidence: 0.9
        # pnpm dlx / yarn dlx: the "download-and-execute" subcommand — always remote.
        - regex: '(?i)\b(pnpm|yarn)\s+dlx\s+[@a-z0-9][\w.-]{2,}'
          confidence: 0.9
        # uv's throwaway tool runner: uvx <tool> fetches from PyPI and runs immediately.
        - regex: '(?i)\buvx\s+[@a-z0-9][\w.-]{3,}'
          confidence: 0.85
        # pipx run <pkg>: one-shot fetch-and-run of a Python package.
        - regex: '(?i)\bpipx\s+run\s+[@a-z0-9][\w.-]{3,}'
          confidence: 0.85
    suppress:
      # A pinned exact version (npx foo@1.2.3, uvx ruff@0.5.0) is auditable — out of scope.
      - '(?i)@\d+\.\d+'
      # A local path / file: spec is not a remote fetch.
      - '(?i)\b(npx|bunx|uvx|dlx|run)\s+(\.{1,2}/|/|file:)'
    rationale: >-
      Package runners like `npx -y`, `bunx -y`, `pnpm dlx`/`yarn dlx`, `uvx`, and `pipx run`
      download AND execute a remote package in a single command — no lockfile, no pin, no
      separate install-then-review step — running with the agent's permissions. A "to get
      started, run …" step in a SKILL.md turns this into unreviewed remote code execution the
      moment the agent follows it. Distinct from an install bootstrap (SG-DEP-002), which only
      stages a dependency; these forms are a fetch-and-execute sink (AST02 supply chain / AST01
      execution).
    fix: >-
      Pin an exact version and install-then-review before running (e.g. `npm install pkg@1.2.3`,
      then invoke the local binary), or vendor the tool into the bundle. Avoid `-y`/`dlx`/`uvx`/
      `run` one-shot remote execution of unpinned packages.

  - id: SG-DEP-001
    title: Unpinned dependency (floats to latest)
    ast: [AST02, AST07]
    # medium: unpinned/range specs are common practice, so this surfaces the
    # supply-chain risk for review rather than hard-failing. Only EXPLICIT
    # floating specs fire (*, latest, @latest, @main, :latest, >=0); caret/tilde
    # ranges (^1.0, ~1.0) are intentionally NOT matched (too common, ~info-level).
    severity: medium
    engine: static
    layer: code
    confidence: 0.7
    targets: [configs, scripts, body, manifest]
    match:
      any:
        # package.json / JSON manifest: version pinned to "*" / "latest".
        # ("x"/"X" as an any-version shorthand is intentionally excluded — as a
        # bare JSON string value it is a common non-dependency literal.)
        - regex: '(?i)"[^"\n]{1,60}"\s*:\s*"(\*|latest)"'
          confidence: 0.7
        # floating install spec: pkg@latest (npm/go/pip). No domain/handle is "@latest".
        - regex: '(?i)@latest\b'
          confidence: 0.7
        # VCS dependency pinned to a MOVING branch (rewrites under you).
        - regex: '(?i)(git\+[a-z]+:|github\.com/|gitlab\.com/|bitbucket\.org/)[^\s"'']{0,80}@(main|master|head|develop|trunk)\b'
          confidence: 0.7
        # container image on the floating :latest tag (Docker/OCI ref shape).
        - regex: '(?i)\b[a-z0-9][a-z0-9._/-]{1,40}:latest\b'
          confidence: 0.6
    suppress:
      # a same-line exact pin (==, digest, git SHA) means it is not actually floating
      - '(?i)(==|@sha(256)?:|#[0-9a-f]{7,40}\b)'
    rationale: >-
      A dependency declared with a floating spec — `"*"`/`"latest"`, `pkg@latest`, a git dep on a
      moving branch (`@main`), or a `:latest` container tag — resolves to whatever is newest at
      install time, so a later malicious release is pulled in with no review (AST02 supply chain;
      AST07 update drift). Caret/tilde ranges, and requirements-style `>=` bounds (indistinguishable
      from numeric comparisons in code without file-type awareness), are intentionally not flagged.
    fix: >-
      Pin an exact version and commit a lockfile with hashes (`pkg==1.2.3`, `"pkg": "1.2.3"`,
      `image@sha256:…`, a git tag or commit SHA). Avoid `latest`/`*`/`@main`.

  - id: SG-DEP-008
    title: Package install redirected to a non-default registry
    ast: [AST02, AST07]
    severity: high
    engine: static
    layer: code
    confidence: 0.9
    targets: [body, scripts, configs, manifest]
    match:
      # Every leaf is 0.9, with no gradation by signal strength — that is forced,
      # not chosen. `docKeywords` includes "example", so any match near an
      # example.com/`.example` URL takes the documentary -0.4, and a scripts /
      # configs target has no +0.15 instruction bonus to absorb it. At 0.85 the
      # env-var and .npmrc leaves silently failed their own tests. Same cliff as
      # SG-MCP-001; see the engine-backlog row on the documentary modifier.
      any:
        # pip / uv: index redirect on the command line or via env.
        - regex: '(?i)\b(pip3?|uv pip|python\s+-m\s+pip)\s+install\b[^\n]{0,120}--(extra-)?index-url[=\s]'
          confidence: 0.9
        - regex: '(?i)\b(pip3?|uv pip|python\s+-m\s+pip)\s+install\b[^\n]{0,120}--trusted-host[=\s]'
          confidence: 0.9
        - regex: '(?i)\bPIP_(EXTRA_)?INDEX_URL\s*='
          confidence: 0.9
        # npm / yarn / pnpm: per-command registry, persisted config, or .npmrc.
        - regex: '(?i)\b(npm|pnpm|yarn)\s+(install|i|add)\b[^\n]{0,120}--registry[=\s]'
          confidence: 0.9
        - regex: '(?i)\b(npm|pnpm|yarn)\s+config\s+set\s+registry\b'
          confidence: 0.9
        - regex: '(?im)^\s*(@[\w-]+:)?registry\s*=\s*https?://'
          confidence: 0.9
        - regex: '(?i)\bNPM_CONFIG_REGISTRY\s*='
          confidence: 0.9
        # Go module proxy / Rust source replacement.
        - regex: '(?i)\bgo\s+env\s+-w\s+GO(PROXY|PRIVATE|NOSUMDB|SUMDB)\s*='
          confidence: 0.9
        - regex: '(?i)\breplace-with\s*=\s*["\x27]'
          confidence: 0.9
    suppress:
      - '(?i)/path/to/'
      # The canonical public indexes are not a redirect.
      - '(?i)(registry\.npmjs\.org|pypi\.org/simple|proxy\.golang\.org)'
    rationale: Redirecting a package manager to a non-default index, registry, or module proxy makes every subsequent install fetch code from a host the skill chose — the delivery half of dependency confusion and typosquatting, and it silently outlives the skill when set via config or env (AST02/AST07).
    fix: Install from the default public registry, or pin the exact artifact by hash. If your organisation genuinely uses an internal mirror, waive this rule in .skillguard.yaml rather than shipping the redirect in a skill.

  - id: SG-DEP-009
    title: Dependency sourced from a raw VCS URL or arbitrary archive
    ast: [AST02, AST07]
    severity: high
    engine: static
    layer: code
    confidence: 0.9
    targets: [body, scripts, configs, manifest]
    match:
      # Sibling of SG-DEP-008. That rule catches "same package name, attacker's
      # registry"; this one catches "no registry at all" — the dependency is a
      # git ref or a bare archive URL, so nothing about it is versioned, hashed,
      # yank-able, or subject to any registry's malware scanning, and a `main`
      # branch reference re-resolves to different code on every install.
      #
      # Every leaf is 0.9 for the same forced reason documented on SG-DEP-008:
      # `scripts`/`configs` targets get no +0.15 instruction bonus, so a single
      # nearby documentary keyword (`example` is one, and example.com is the
      # natural host to write in a fixture) would sink anything lower.
      any:
        # pip / uv — VCS reference, or a direct URL to an archive/wheel.
        - regex: '(?i)\b(pip3?|uv pip|uv add|python\s+-m\s+pip)\s+(install|add)\b[^\n]{0,120}\bgit\+'
          confidence: 0.9
        - regex: '(?i)\b(pip3?|uv pip|python\s+-m\s+pip)\s+install\b[^\n]{0,120}https?://[^\s]+\.(tar\.gz|tgz|zip|whl)'
          confidence: 0.9
        # PEP 508 direct reference in a requirements file: `name @ git+…` /
        # `name @ https://…/pkg-1.0.tar.gz`. Anchored so prose like
        # "contact the author @ https://example.com" cannot match — the URL must
        # end in a VCS scheme or an archive extension.
        - regex: '(?im)^\s*[\w.-]+\s*@\s*(git\+\S+|https?://\S+\.(tar\.gz|tgz|zip|whl))'
          confidence: 0.9
        # npm / yarn / pnpm / bun — git dependency or a tarball URL.
        - regex: '(?i)\b(npm|pnpm|yarn|bun)\s+(install|i|add)\b[^\n]{0,120}(git\+|github:|gitlab:|bitbucket:|https?://[^\s]+\.(tgz|tar\.gz))'
          confidence: 0.9
        # The same thing declared in package.json rather than on a command line.
        # Requires a VCS scheme or an archive extension, so an ordinary
        # `"homepage": "https://github.com/me/proj"` is not a dependency spec.
        - regex: '(?i)"[\w@/.-]+"\s*:\s*"(git\+|github:|gitlab:|bitbucket:|https?://[^"]+\.(tgz|tar\.gz))'
          confidence: 0.9
        # Cargo — `cargo add --git`, or a git dependency in Cargo.toml.
        - regex: '(?im)\bcargo\s+add\b[^\n]{0,80}--git\b|^\s*[\w-]+\s*=\s*\{[^\n]*\bgit\s*='
          confidence: 0.9
        # Bundler — `gem "x", git:/github:` in a Gemfile.
        - regex: '(?im)^\s*gem\s+[\x27"][\w-]+[\x27"][^\n]{0,80},\s*(git|github)\s*:'
          confidence: 0.9
    suppress:
      - '(?i)/path/to/'
    rationale: A dependency pulled from a raw git URL or a bare archive URL bypasses the registry entirely — no version resolution, no integrity hash, no yank or malware scanning, and a branch reference re-resolves to whatever the repository holds at install time (AST02/AST07).
    fix: Depend on a published, version-pinned package from the default registry. If a VCS dependency is unavoidable, pin it to an immutable commit SHA and record the artifact hash.

  - id: SG-DEP-011
    title: Fetches a binary/blob and marks it executable
    ast: [AST02, AST01]
    severity: high
    engine: static
    layer: code
    confidence: 0.85
    targets: [body, scripts, configs]
    match:
      # Download an opaque binary/blob and make it runnable in one breath —
      # `curl … -o /usr/local/bin/tool && chmod +x /usr/local/bin/tool`. This is
      # RCE delivery of an unreviewed, unpinned artifact, distinct from
      # `curl | sh` (SG-NET-002, which pipes to an interpreter) and from a
      # package runner (SG-DEP-007). The precision is in the *pairing*: a bare
      # `chmod +x script.sh` on the skill's own file is ordinary and common
      # (15 corpus hits, all benign), but a fetch AND a chmod +x joined on one
      # command line had 0 corpus hits.
      any:
        # fetch … then chmod +x, same line (&& / ; / || / |).
        - regex: '(?i)\b(curl|wget)\b[^\n]{0,160}(&&|\|\||;|\|)[^\n]{0,60}\bchmod\s+([ugoa]*\+[rwxXst]*x|[0-7]*[1357][0-7]*)\b'
          confidence: 0.85
        # chmod +x … then fetch on the same line (rarer ordering).
        - regex: '(?i)\bchmod\s+([ugoa]*\+[rwxXst]*x|[0-7]*[1357][0-7]*)\b[^\n]{0,60}(&&|\|\||;)[^\n]{0,60}\b(curl|wget)\b'
          confidence: 0.8
        # base64/xxd-decode a blob into a file, then chmod +x it — the packed
        # form that avoids a network fetch entirely.
        - regex: '(?i)\b(base64\s+-d|base64\s+--decode|xxd\s+-r)\b[^\n]{0,120}(&&|;)[^\n]{0,60}\bchmod\s+([ugoa]*\+[rwxXst]*x|[0-7]*[1357][0-7]*)\b'
          confidence: 0.85
    suppress:
      - '(?i)/path/to/'
    rationale: Downloading (or decoding) an opaque binary and marking it executable in one step installs unreviewed, unpinned native code that then runs with the agent's privileges — a direct RCE-delivery path that no registry, hash, or scan ever saw (AST02 supply chain / AST01 execution).
    fix: Do not fetch-and-run binaries. Install tools from a package manager with a pinned version and a verified checksum, or vendor the reviewed binary into the bundle with a recorded hash.
