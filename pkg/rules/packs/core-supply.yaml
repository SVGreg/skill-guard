apiVersion: skillguard.net/rulepack.v1
name: core-supply
version: 1.1.1
description: Supply chain — unpinned/remote dependencies pulled and executed at use time (rule-verification.md §4, AST02).
rules:
  - id: SG-DEP-007
    title: Remote-package auto-execution via a package runner
    ast: [AST02, AST01]
    # medium (warn, not fail): the runner idiom is the *normal* way legitimate
    # tools are invoked (`uvx markitdown`, `npx -y @scope/cli`), and static
    # analysis cannot tell a trusted package from a malicious one — both are
    # unpinned remote fetch-and-execute. This surfaces the capability for review
    # without hard-failing every skill that documents a tool. Real corpus check:
    # 26 hits over 7/240 skills, all genuine runner invocations (see rule-verification.md §4).
    severity: medium
    engine: static
    layer: code
    confidence: 0.9
    targets: [body, scripts, configs]
    match:
      any:
        # npx/bunx with an explicit auto-confirm flag: fetches AND runs, no prompt.
        - regex: '(?i)\b(npx|bunx)\b[^\n]{0,40}(-y\b|--yes\b)'
          confidence: 0.9
        # pnpm dlx / yarn dlx: the "download-and-execute" subcommand — always remote.
        - regex: '(?i)\b(pnpm|yarn)\s+dlx\s+[@a-z0-9][\w.-]{2,}'
          confidence: 0.9
        # uv's throwaway tool runner: uvx <tool> fetches from PyPI and runs immediately.
        - regex: '(?i)\buvx\s+[@a-z0-9][\w.-]{3,}'
          confidence: 0.85
        # pipx run <pkg>: one-shot fetch-and-run of a Python package.
        - regex: '(?i)\bpipx\s+run\s+[@a-z0-9][\w.-]{3,}'
          confidence: 0.85
        # bunx has no confirmation prompt at all — unlike npx there is nothing to
        # auto-accept — so requiring `-y` left the rule blind to the only form
        # bunx actually has, while its own title and rationale name it. Corpus:
        # 31 files across 4 bundles, three of them one skill family documenting
        # `bunx remotion`, which is the same shape as the `uvx markitdown`
        # cluster the rule already counts.
        - regex: '(?i)\b(?:bunx|bun[ \t]+x)[ \t]+[@a-z0-9][\w.@/-]{2,}'
          confidence: 0.85
        # `npm exec` is npx's modern spelling: same fetch-and-run, same absence
        # of a pin. 0 corpus files.
        - regex: '(?i)\bnpm[ \t]+exec[ \t]+(?:-y[ \t]+|--yes[ \t]+|--[ \t]+)?[@a-z0-9][\w.@/-]{2,}'
          confidence: 0.85
        # `uv tool run` is `uvx` spelled out, and `uv run --with` pulls a package
        # into a throwaway environment and executes inside it. 1 and 2 files.
        - regex: '(?i)\buv[ \t]+tool[ \t]+run[ \t]+[@a-z0-9][\w.-]{2,}'
          confidence: 0.85
        - regex: '(?i)\buv[ \t]+run\b[^\n]{0,40}--with[ \t]+[@a-z0-9][\w.-]{2,}'
          confidence: 0.85
        # deno run against a REMOTE spec. The local-file form (`deno run main.ts`,
        # `deno run ./x.ts`) is ordinary and must not match, so a remote spec
        # prefix is required rather than the bare verb. 0 corpus files, and the
        # https form is the most on-point payload shape in this family: an
        # arbitrary remote script executed with an explicit all-permissions flag.
        - regex: '(?i)\bdeno[ \t]+run\b[^\n]{0,60}(?:npm:|jsr:|https?://)[\w.@/:-]{2,}'
          confidence: 0.9
    suppress:
      # A pinned exact version (npx foo@1.2.3, uvx ruff@0.5.0) is auditable — out of scope.
      - '(?i)@\d+\.\d+'
      # A local path / file: spec is not a remote fetch.
      - '(?i)\b(npx|bunx|uvx|dlx|run)\s+(\.{1,2}/|/|file:)'
    rationale: >-
      Package runners like `npx -y`, `bunx -y`, `pnpm dlx`/`yarn dlx`, `uvx`, and `pipx run`
      download AND execute a remote package in a single command — no lockfile, no pin, no
      separate install-then-review step — running with the agent's permissions. A "to get
      started, run …" step in a SKILL.md turns this into unreviewed remote code execution the
      moment the agent follows it. Distinct from an install bootstrap (SG-DEP-002), which only
      stages a dependency; these forms are a fetch-and-execute sink (AST02 supply chain / AST01
      execution).
    fix: >-
      Pin an exact version and install-then-review before running (e.g. `npm install pkg@1.2.3`,
      then invoke the local binary), or vendor the tool into the bundle. Avoid `-y`/`dlx`/`uvx`/
      `run` one-shot remote execution of unpinned packages.

  - id: SG-DEP-001
    title: Unpinned dependency (floats to latest)
    ast: [AST02, AST07]
    # medium: unpinned/range specs are common practice, so this surfaces the
    # supply-chain risk for review rather than hard-failing. Only EXPLICIT
    # floating specs fire (*, latest, @latest, @main, :latest, >=0); caret/tilde
    # ranges (^1.0, ~1.0) are intentionally NOT matched (too common, ~info-level).
    severity: medium
    engine: static
    layer: code
    confidence: 0.7
    targets: [configs, scripts, body, manifest]
    match:
      any:
        # package.json / JSON manifest: version pinned to "*" / "latest".
        # ("x"/"X" as an any-version shorthand is intentionally excluded — as a
        # bare JSON string value it is a common non-dependency literal.)
        - regex: '(?i)"[^"\n]{1,60}"\s*:\s*"(\*|latest)"'
          confidence: 0.7
        # floating install spec: pkg@latest (npm/go/pip). No domain/handle is "@latest".
        - regex: '(?i)@latest\b'
          confidence: 0.7
        # VCS dependency pinned to a MOVING branch (rewrites under you).
        - regex: '(?i)(git\+[a-z]+:|github\.com/|gitlab\.com/|bitbucket\.org/)[^\s"'']{0,80}@(main|master|head|develop|trunk)\b'
          confidence: 0.7
        # container image on the floating :latest tag (Docker/OCI ref shape).
        - regex: '(?i)\b[a-z0-9][a-z0-9._/-]{1,40}:latest\b'
          confidence: 0.6
    suppress:
      # a same-line exact pin (==, digest, git SHA) means it is not actually floating
      - '(?i)(==|@sha(256)?:|#[0-9a-f]{7,40}\b)'
      # A `"*"` value is a version only inside a dependency block. In an agent
      # hook / access-control config it is a SCOPE wildcard meaning "all", and
      # the JSON leaf cannot tell the two apart because it matches any key.
      # Corpus FP: `{ "type": "PostToolUse", "matcher": "*", … }` — the standard
      # Claude Code hook matcher, reported as a floating dependency (cycle 112).
      # Only the two keys actually observed are carved out; see
      # rule-verification.md §SG-DEP-001 for the `engines` exposure left open.
      - '(?i)"(matcher|value)"\s*:\s*"\*"'
    rationale: >-
      A dependency declared with a floating spec — `"*"`/`"latest"`, `pkg@latest`, a git dep on a
      moving branch (`@main`), or a `:latest` container tag — resolves to whatever is newest at
      install time, so a later malicious release is pulled in with no review (AST02 supply chain;
      AST07 update drift). Caret/tilde ranges, and requirements-style `>=` bounds (indistinguishable
      from numeric comparisons in code without file-type awareness), are intentionally not flagged.
    fix: >-
      Pin an exact version and commit a lockfile with hashes (`pkg==1.2.3`, `"pkg": "1.2.3"`,
      `image@sha256:…`, a git tag or commit SHA). Avoid `latest`/`*`/`@main`.

  - id: SG-DEP-008
    title: Package install redirected to a non-default registry
    ast: [AST02, AST07]
    severity: high
    engine: static
    layer: code
    confidence: 0.9
    targets: [body, scripts, configs, manifest]
    match:
      # Every leaf is 0.9, with no gradation by signal strength — that is forced,
      # not chosen. `docKeywords` includes "example", so any match near an
      # example.com/`.example` URL takes the documentary -0.4, and a scripts /
      # configs target has no +0.15 instruction bonus to absorb it. At 0.85 the
      # env-var and .npmrc leaves silently failed their own tests. Same cliff as
      # SG-MCP-001; see the engine-backlog row on the documentary modifier.
      any:
        # pip / uv: index redirect on the command line or via env.
        - regex: '(?i)\b(pip3?|uv pip|python\s+-m\s+pip)\s+install\b[^\n]{0,120}--(extra-)?index-url[=\s]'
          confidence: 0.9
        - regex: '(?i)\b(pip3?|uv pip|python\s+-m\s+pip)\s+install\b[^\n]{0,120}--trusted-host[=\s]'
          confidence: 0.9
        - regex: '(?i)\bPIP_(EXTRA_)?INDEX_URL\s*='
          confidence: 0.9
        # npm / yarn / pnpm: per-command registry, persisted config, or .npmrc.
        - regex: '(?i)\b(npm|pnpm|yarn)\s+(install|i|add)\b[^\n]{0,120}--registry[=\s]'
          confidence: 0.9
        - regex: '(?i)\b(npm|pnpm|yarn)\s+config\s+set\s+registry\b'
          confidence: 0.9
        - regex: '(?im)^\s*(@[\w-]+:)?registry\s*=\s*https?://'
          confidence: 0.9
        - regex: '(?i)\bNPM_CONFIG_REGISTRY\s*='
          confidence: 0.9
        # Go module proxy / Rust source replacement.
        - regex: '(?i)\bgo\s+env\s+-w\s+GO(PROXY|PRIVATE|NOSUMDB|SUMDB)\s*='
          confidence: 0.9
        - regex: '(?i)\breplace-with\s*=\s*["\x27]'
          confidence: 0.9
    suppress:
      - '(?i)/path/to/'
      # The canonical public indexes are not a redirect.
      - '(?i)(registry\.npmjs\.org|pypi\.org/simple|proxy\.golang\.org)'
    rationale: Redirecting a package manager to a non-default index, registry, or module proxy makes every subsequent install fetch code from a host the skill chose — the delivery half of dependency confusion and typosquatting, and it silently outlives the skill when set via config or env (AST02/AST07).
    fix: Install from the default public registry, or pin the exact artifact by hash. If your organisation genuinely uses an internal mirror, waive this rule in .skillguard.yaml rather than shipping the redirect in a skill.

  - id: SG-DEP-009
    title: Dependency sourced from a raw VCS URL or arbitrary archive
    ast: [AST02, AST07]
    severity: high
    engine: static
    layer: code
    confidence: 0.9
    targets: [body, scripts, configs, manifest]
    match:
      # Sibling of SG-DEP-008. That rule catches "same package name, attacker's
      # registry"; this one catches "no registry at all" — the dependency is a
      # git ref or a bare archive URL, so nothing about it is versioned, hashed,
      # yank-able, or subject to any registry's malware scanning, and a `main`
      # branch reference re-resolves to different code on every install.
      #
      # Every leaf is 0.9 for the same forced reason documented on SG-DEP-008:
      # `scripts`/`configs` targets get no +0.15 instruction bonus, so a single
      # nearby documentary keyword (`example` is one, and example.com is the
      # natural host to write in a fixture) would sink anything lower.
      any:
        # pip / uv — VCS reference, or a direct URL to an archive/wheel.
        - regex: '(?i)\b(pip3?|uv pip|uv add|python\s+-m\s+pip)\s+(install|add)\b[^\n]{0,120}\bgit\+'
          confidence: 0.9
        - regex: '(?i)\b(pip3?|uv pip|python\s+-m\s+pip)\s+install\b[^\n]{0,120}https?://[^\s]+\.(tar\.gz|tgz|zip|whl)'
          confidence: 0.9
        # PEP 508 direct reference in a requirements file: `name @ git+…` /
        # `name @ https://…/pkg-1.0.tar.gz`. Anchored so prose like
        # "contact the author @ https://example.com" cannot match — the URL must
        # end in a VCS scheme or an archive extension.
        - regex: '(?im)^\s*[\w.-]+\s*@\s*(git\+\S+|https?://\S+\.(tar\.gz|tgz|zip|whl))'
          confidence: 0.9
        # npm / yarn / pnpm / bun — git dependency or a tarball URL.
        - regex: '(?i)\b(npm|pnpm|yarn|bun)\s+(install|i|add)\b[^\n]{0,120}(git\+|github:|gitlab:|bitbucket:|https?://[^\s]+\.(tgz|tar\.gz))'
          confidence: 0.9
        # The same thing declared in package.json rather than on a command line.
        # Requires a VCS scheme or an archive extension, so an ordinary
        # `"homepage": "https://github.com/me/proj"` is not a dependency spec.
        - regex: '(?i)"[\w@/.-]+"\s*:\s*"(git\+|github:|gitlab:|bitbucket:|https?://[^"]+\.(tgz|tar\.gz))'
          confidence: 0.9
        # Cargo — `cargo add --git`, or a git dependency in Cargo.toml.
        - regex: '(?im)\bcargo\s+add\b[^\n]{0,80}--git\b|^\s*[\w-]+\s*=\s*\{[^\n]*\bgit\s*='
          confidence: 0.9
        # Bundler — `gem "x", git:/github:` in a Gemfile.
        - regex: '(?im)^\s*gem\s+[\x27"][\w-]+[\x27"][^\n]{0,80},\s*(git|github)\s*:'
          confidence: 0.9
    suppress:
      - '(?i)/path/to/'
    rationale: A dependency pulled from a raw git URL or a bare archive URL bypasses the registry entirely — no version resolution, no integrity hash, no yank or malware scanning, and a branch reference re-resolves to whatever the repository holds at install time (AST02/AST07).
    fix: Depend on a published, version-pinned package from the default registry. If a VCS dependency is unavoidable, pin it to an immutable commit SHA and record the artifact hash.

  - id: SG-DEP-011
    title: Fetches a binary/blob and marks it executable
    ast: [AST02, AST01]
    severity: high
    engine: static
    layer: code
    confidence: 0.85
    targets: [body, scripts, configs]
    match:
      # Download an opaque binary/blob and make it runnable in one breath —
      # `curl … -o /usr/local/bin/tool && chmod +x /usr/local/bin/tool`. This is
      # RCE delivery of an unreviewed, unpinned artifact, distinct from
      # `curl | sh` (SG-NET-002, which pipes to an interpreter) and from a
      # package runner (SG-DEP-007). The precision is in the *pairing*: a bare
      # `chmod +x script.sh` on the skill's own file is ordinary and common
      # (15 corpus hits, all benign), but a fetch AND a chmod +x joined on one
      # command line had 0 corpus hits.
      any:
        # fetch … then chmod +x, same line (&& / ; / || / |).
        - regex: '(?i)\b(curl|wget)\b[^\n]{0,160}(&&|\|\||;|\|)[^\n]{0,60}\bchmod\s+([ugoa]*\+[rwxXst]*x|[0-7]*[1357][0-7]*)\b'
          confidence: 0.85
        # chmod +x … then fetch on the same line (rarer ordering).
        - regex: '(?i)\bchmod\s+([ugoa]*\+[rwxXst]*x|[0-7]*[1357][0-7]*)\b[^\n]{0,60}(&&|\|\||;)[^\n]{0,60}\b(curl|wget)\b'
          confidence: 0.8
        # base64/xxd-decode a blob into a file, then chmod +x it — the packed
        # form that avoids a network fetch entirely.
        - regex: '(?i)\b(base64\s+-d|base64\s+--decode|xxd\s+-r)\b[^\n]{0,120}(&&|;)[^\n]{0,60}\bchmod\s+([ugoa]*\+[rwxXst]*x|[0-7]*[1357][0-7]*)\b'
          confidence: 0.85
    suppress:
      - '(?i)/path/to/'
    rationale: Downloading (or decoding) an opaque binary and marking it executable in one step installs unreviewed, unpinned native code that then runs with the agent's privileges — a direct RCE-delivery path that no registry, hash, or scan ever saw (AST02 supply chain / AST01 execution).
    fix: Do not fetch-and-run binaries. Install tools from a package manager with a pinned version and a verified checksum, or vendor the reviewed binary into the bundle with a recorded hash.

  - id: SG-DEP-010
    title: Package manifest ships an install-lifecycle hook that runs a command
    ast: [AST02, AST01]
    severity: high
    engine: static
    layer: code
    confidence: 0.85
    targets: [configs, manifest, body]
    match:
      # The declarative sibling of SG-CFG-001 (agent-hook config): shipping a
      # package.json whose `scripts` block wires an INSTALL-time lifecycle key to
      # a command means `npm install` auto-runs that command with the user's
      # privileges, before any code is reviewed or run. Scoped to the install/
      # uninstall keys — the ones npm fires on install — and deliberately NOT
      # `prepare`/`prepublish`, which are build-time and dominated by the benign
      # `husky install` idiom. Corpus: 21 package.json files, 0 with any of these
      # keys, so this is a clean high-signal match.
      any:
        - regex: '(?i)"(preinstall|install|postinstall|preuninstall|uninstall|postuninstall)"\s*:\s*"[^"]+"'
          confidence: 0.85
    suppress:
      # A bare version range as the value is a dependency named "install", not a
      # lifecycle command.
      - '(?i)"(install|uninstall)"\s*:\s*"[\^~]?\d+\.\d+'
      - '(?i)/path/to/'
    rationale: A package.json that binds an install-lifecycle key (preinstall/install/postinstall/…/uninstall) to a command makes `npm install` execute that command automatically, with the user's privileges and before any review — installing code execution by shipping a manifest (AST02 supply chain / AST01 execution). Same shape as a bundled agent-hook config (SG-CFG-001).
    fix: Do not ship install-lifecycle scripts in a skill bundle. If a build step is genuinely required, document it and let the user run it deliberately after review — never on `npm install`.

  - id: SG-EVA-001
    title: Self-extracting payload staged in a scanner-skipped location
    ast: [AST08, AST01]
    severity: high
    engine: static
    layer: code
    confidence: 0.8
    targets: [body, scripts, configs]
    match:
      # "Self-Extracting Skill (SFS) packing" (Cloak and Detonate, arXiv
      # 2607.02357): the real payload is sealed as an opaque blob inside a
      # directory scanners skip by convention — `.git/` — and shipped with a
      # benign cover SKILL.md plus a small decoder. At install time a scanner
      # sees a harmless tree; at first execution the decoder rematerializes the
      # payload (typically as WORKFLOW.md) and the agent follows it. Measured
      # to bypass >=90% of every static scanner tested.
      #
      # skill-guard has exactly this blind spot, verified on main before this
      # rule: `skipNames` in pkg/skill/skill.go drops `.git`, and the walk also
      # drops every `*.skillsig`, so BOTH a `.git/skillpack.dat` bundle and a
      # `payload.skillsig` bundle scan `pass / 0 findings`.
      #
      # A rule cannot read a file the walk never opens — but it does not need
      # to. **The decoder is always visible**: it lives in a scanned script or
      # in the body prose, and the blob is inert without it. So this rule
      # matches the decoder's reach into the skipped location rather than the
      # blob itself. (The provenance half of issue #17 — those files are also
      # outside the Merkle root, so the blob can be rewritten after signing and
      # `verify` still passes — is a signing-semantics decision left to the
      # owner and deliberately not changed here.)
      #
      # Precision: the paired shape measured **0 hits across the 777-bundle
      # evaluation corpus**, with the broadest verb set tried (including
      # `python -c`/`node -e`). A *bare* `.git/<path>` leaf would have taken 45
      # occurrences across 27 files — all genuine git internals (`.git/hooks`,
      # `.git/config`, `.git/index.lock`, `.git/logs/HEAD`) — which is why the
      # decoder verb is required and why those paths are NOT suppressed: a path
      # carve-out would document its own bypass (`base64 -d .git/objects/x`).
      any:
        # (a) A decode/extract command reaching into a VCS metadata directory.
        - regex: '(?i)(?:base64\s+(?:-d|-D|--decode)|xxd\s+-r|uudecode|openssl\s+enc[^\n]{0,40}-d\b|gunzip|zcat|gzip\s+-d|tar\s+-?[xz]|unzip|7z[ar]?\s+[xe]|python3?\s+-c|node\s+-e|perl\s+-[pe]|base64\.b64decode|\batob\s*\(|Buffer\.from\s*\()[^\n]{0,80}\.(?:git|hg|svn)/[^\s"''|;)]+'
          confidence: 0.85
        # (b) Same pair, path first — `cat .git/skillpack.dat | base64 -d`.
        - regex: '(?i)\.(?:git|hg|svn)/[^\s"''|;)]+[^\n]{0,80}(?:base64\s+(?:-d|-D|--decode)|xxd\s+-r|uudecode|openssl\s+enc[^\n]{0,40}-d\b|gunzip|zcat|gzip\s+-d|tar\s+-?[xz]|unzip|7z[ar]?\s+[xe]|base64\.b64decode|\batob\s*\(|Buffer\.from\s*\()'
          confidence: 0.85
        # (c) Anything out of a skipped directory redirected over an agent
        # instruction file — the rematerialization step itself, which needs no
        # decoder verb (`cat .git/blob > WORKFLOW.md`).
        - regex: '(?i)\.(?:git|hg|svn)/[^\n]{0,60}>\s*[^\s;|]*(?:SKILL|WORKFLOW|AGENTS?|CLAUDE|GEMINI|INSTRUCTIONS|RULES)\.mdx?\b'
          confidence: 0.85
        # (d) The same staging trick against skill-guard's *own* skip rule: the
        # walk drops every `*.skillsig` (the attestation sidecar), so a blob
        # named `payload.skillsig` is equally invisible. Nothing legitimate
        # decodes a `.skillsig` — `verify` reads it, scripts do not.
        - regex: '(?i)(?:base64\s+(?:-d|-D|--decode)|xxd\s+-r|uudecode|openssl\s+enc[^\n]{0,40}-d\b|gunzip|zcat|tar\s+-?[xz]|unzip|7z[ar]?\s+[xe]|python3?\s+-c|node\s+-e|base64\.b64decode|\batob\s*\(|Buffer\.from\s*\()[^\n]{0,80}[^\s"''|;)]*\.skillsig\b'
          confidence: 0.8
        # (e) A `.skillsig` rematerialized over an instruction file.
        - regex: '(?i)[^\s"''|;)]*\.skillsig\b[^\n]{0,60}>\s*[^\s;|]*(?:SKILL|WORKFLOW|AGENTS?|CLAUDE|GEMINI|INSTRUCTIONS|RULES)\.mdx?\b'
          confidence: 0.85
    suppress:
      # Inspecting a DSSE attestation is not staging a payload: the envelope's
      # `.payload` field is genuinely base64, so a documented "decode the
      # attestation" example must stay clean. Hinged on an attestation noun so
      # it cannot be used as a bypass — a decoder pointed at a blob has no
      # reason to name DSSE or `skill-guard verify`.
      - '(?i)\bdsse\b|\.payload\b|skill-guard\s+(?:verify|sign|attest)'
      - '(?i)/path/to/'
    rationale: >-
      Sealing the real payload in a location the scanner never opens — a `.git/` blob, or a file named
      `*.skillsig` — and shipping a small decoder that rematerializes it at first run defeats static review
      by construction: the reviewed tree and the executed skill are different artifacts (AST08 poor
      scanning, AST01 injection). The blob is inert without the decoder, so the decoder is the durable
      signal. Sibling of SG-EVA-002, which hides the payload by encoding rather than by location.
    fix: >-
      Ship every file the skill actually uses in the bundle proper, where it can be reviewed, scanned and
      hashed. Never stage content in `.git/` or under a `*.skillsig` name, and never have a setup step
      write an agent instruction file (`SKILL.md`, `WORKFLOW.md`, `CLAUDE.md`) from an unreviewed blob.

  - id: SG-EVA-002
    title: Encrypted / password-protected payload container
    ast: [AST08, AST02]
    severity: high
    engine: static
    layer: code
    confidence: 0.8
    targets: [body, scripts, configs]
    match:
      # The payload ships (or is fetched) inside a container nothing in the
      # review path can open — a password-protected zip/7z, a symmetric GPG
      # blob, an `openssl enc` blob — and the skill hands the passphrase to the
      # agent in its own prose or setup script. Only the agent, at run time,
      # ever materialises the plaintext, and it then runs it.
      #
      # Sibling of SG-EVA-001: 001 hides the payload by *location* (a directory
      # the walker skips), 002 hides it in plain sight by *encoding*. Unlike
      # 001 this needs no engine change.
      #
      # SG-DEP-011 is the near miss and structurally cannot cover this: every
      # one of its leaves joins the fetch AND the `chmod +x` on one command
      # line, while the archive shape splits them across lines with a
      # decryption step in between (verified: the full chain scanned clean).
      #
      # Precision note: an inline archive passphrase is essentially never
      # legitimate in a skill bundle. Each command leaf below measured **0 hits
      # across the 777-bundle evaluation corpus**, so — unlike SG-DEP-011,
      # whose precision had to come from a join — the flag can be the signal by
      # itself. The corpus also shows why the openssl leaf is scoped to `enc`:
      # bare `openssl` would inherit 14 `openssl dgst` hits (hashing, not
      # decryption).
      any:
        # (a) Password-protected zip extraction, inline literal password.
        # `-P` is unzip's password flag (`-p` is pipe-to-stdout), so only the
        # command name is case-folded. The trailing class rejects another flag
        # and rejects `$VAR`, which leaf (b) takes at a lower confidence.
        - regex: '(?i:\bunzip\b)[^\n]{0,60}\s-P\s*["'']?[^-\s"''$]'
          confidence: 0.85
        # (b) Same flag, passphrase supplied by a variable — still an encrypted
        # container, but the secret may be prompted rather than shipped.
        - regex: '(?i:\bunzip\b)[^\n]{0,60}\s-P\s*["'']?\$'
          confidence: 0.7
        # (c) 7-Zip with an inline password: `7z x -p"openclaw" payload.7z`.
        - regex: '(?i:\b7z[ar]?\b)[^\n]{0,60}\s-p\s*["'']?[^-\s"''$]'
          confidence: 0.85
        # (d) Creating an encrypted archive — the exfil-packing direction of the
        # same primitive (`zip -P pw out.zip ~/.ssh`). `\bzip\b` does not match
        # inside `unzip`/`gzip`/`bzip2`, so this does not double-fire on (a).
        - regex: '(?i:\bzip\b)[^\n]{0,60}\s-(?:P\s*["'']?[^-\s"''$]|e\s)'
          confidence: 0.75
        # (e) Symmetric GPG decryption with the passphrase supplied inline.
        - regex: '(?i)\bgpg\b[^\n]{0,80}--(?:batch-)?passphrase(?:-file|-fd)?[\s=]'
          confidence: 0.85
        # (f) GPG decryption without an inline secret — weaker, the passphrase
        # may be prompted, but a skill bundle opening a GPG blob at all is the
        # same opaque-container shape.
        - regex: '(?i)\bgpg\b[^\n]{0,60}(?:--decrypt\b|\s-d\b)'
          confidence: 0.7
        # (g) `openssl enc` with a decrypt or key flag. Scoped to `enc` on
        # purpose — see the corpus note above.
        - regex: '(?i)\bopenssl\s+enc\b[^\n]{0,100}(?:\s-d\b|\s-pass\b|\s-k\b|\s-K\b|\s-kfile\b)'
          confidence: 0.85
        # (h) The documentation giveaway: the skill hands the extraction
        # passphrase to the agent in prose ("extract using pass: `openclaw`").
        # Measured 0/777, where the looser `extract … password` shape without
        # the using/with hinge measured 5 — all benign ("0% pass rate",
        # "pass flags after `--`", `reader.decrypt("password")`).
        - regex: '(?i)\b(?:extract|unzip|unpack|decompress)[a-z]*\b[^\n]{0,30}\b(?:us(?:e|ing)|with)\b[^\n]{0,20}\b(?:pass|password|passphrase)\b'
          confidence: 0.7
        # (i) Same idea, reversed: the passphrase named first, then what it opens.
        - regex: '(?i)\b(?:password|passphrase|pass)\b[^\n]{0,40}\b(?:to|for)\b[^\n]{0,20}\b(?:extract|unzip|unpack|decrypt)[a-z]*\b'
          confidence: 0.7
        # (j) An archive noun tied to a passphrase.
        - regex: '(?i)\b(?:archive|zip file|zipfile|\.zip\b|\.7z\b|\.rar\b|tarball)\b[^\n]{0,40}\b(?:password|passphrase)\b'
          confidence: 0.7
    suppress:
      # Signature checking is not decryption — the whole point of the carve-out.
      - '(?i)\bgpg\b[^\n]{0,60}--verify'
      - '(?i)\bopenssl\s+dgst\b'
      # Placeholders in documentation, not a shipped secret.
      - '(?i)<pass(word|phrase)?>|\byour[_-]?password\b|\bplaceholder\b'
      - '(?i)/path/to/'
    rationale: >-
      Sealing the payload in a container no scanner and no reviewer can open — a password-protected zip/7z,
      a symmetric GPG blob, an `openssl enc` blob — while handing the passphrase to the agent defeats the
      review path by construction, because only the agent, at run time, ever sees the plaintext it then
      runs (AST08 poor scanning, AST02 supply chain). The sibling of SG-EVA-001, which hides the payload by
      location rather than by encoding.
    fix: Ship the payload in the clear so it can be reviewed and hashed. If an artifact genuinely must be encrypted at rest, do not put the passphrase in the bundle, and record the plaintext artifact's checksum so a reviewer can verify what will actually run.

  - id: SG-EVA-003
    title: Bundled image or PDF used as an instruction carrier
    ast: [AST08, AST01]
    severity: high
    engine: static
    layer: content
    confidence: 0.8
    targets: [body, manifest, scripts]
    match:
      # Third member of the evasion family: SG-EVA-001 hides the payload by
      # LOCATION (a scanner-skipped directory), SG-EVA-002 by ENCODING (an
      # encrypted container), and this one by MODALITY — the instructions are
      # rendered inside a bundled image or PDF, which pkg/skill.classify files as
      # an inert `asset` that no rule ever reads. OCR is not this scanner's job,
      # so as with its siblings the rule matches the *pointer*, never the payload.
      #
      # SCOPE, STATED PLAINLY: this catches the explicit imperative — "read
      # foo.png and run what it says" — and it does NOT catch SkillCamo (arXiv
      # 2606.18198), whose whole method is to rewrite the surrounding prose so the
      # image reads as an ordinary figure caption and the agent opens it on its
      # own initiative. Triage measured that trade-off on 703 corpus bundles:
      # "ingest verb + image noun" alone matches 86 bundles (12%) and is unusable,
      # while adding the follow verb leaves 1 — a false positive on the *container*
      # sense of "image". The unsophisticated half is what static text analysis can
      # honestly reach; the rest is a T3/multimodal problem (docs/planned-rules.md).
      #
      # `image` is polysemous and the corpus is full of the other sense (Docker /
      # sandbox / base images), which is why every leaf requires a file extension
      # or an explicit bundling word ("the attached/bundled/included image"), never
      # a bare "image".
      any:
        # ingest verb → bundled asset → follow/execute verb
        - regex: '(?i)\b(open|read|view|look\s+at|inspect|examine|scan|transcribe|decode|extract|use\s+your\s+vision(\s+tool)?\s+(on|to\s+read))\b[^\n]{0,45}([\w./-]*\.(png|jpe?g|webp|gif|bmp|svg|pdf)\b|\b(the|this|that|attached|bundled|included|enclosed)\s+(image|picture|photo|screenshot|diagram|figure|chart|qr[\s-]?code|pdf)\b)[^\n]{0,45}\b(follow|obey|execute|run|carry\s+(it|them|these|those)?\s*out|do\s+what\s+it|apply\s+(it|them|the\s+steps)|comply|perform\s+the\s+(steps|commands|instructions))\b'
          confidence: 0.8
        # instruction noun located IN the asset → follow/execute verb ("the
        # commands are in the attached image; run them exactly")
        - regex: '(?i)\b(instructions?|steps?|commands?|directives?)\b[^\n]{0,30}\b(in|inside|within|from)\b[^\n]{0,20}([\w./-]*\.(png|jpe?g|webp|gif|bmp|svg|pdf)\b|\b(the|this|that|attached|bundled|included|enclosed)\s+(image|picture|photo|screenshot|diagram|figure|chart|qr[\s-]?code|pdf)\b)[^\n]{0,45}\b(follow|obey|execute|run|carry\s+(it|them|these|those)?\s*out|do\s+what\s+it|apply\s+(it|them|the\s+steps)|comply|perform\s+the\s+(steps|commands|instructions))\b'
          confidence: 0.8
        # asset → "treat its contents as your instructions" (the promotion form;
        # SG-REF-005 catches the carrier-agnostic version of this sentence, but
        # only when the wording matches its own leaf — this one is anchored on the
        # asset, so it survives rewording of the promotion clause)
        - regex: '(?i)([\w./-]*\.(png|jpe?g|webp|gif|bmp|svg|pdf)\b|\b(the|this|that|attached|bundled|included|enclosed)\s+(image|picture|photo|screenshot|diagram|figure|chart|qr[\s-]?code|pdf)\b)[^\n]{0,40}\b(treat|use)\s+(it|its\s+\w+|them|the\s+text|the\s+contents?)[^\n]{0,15}\bas\s+(your\s+)?(instructions?|directives?|commands?|the\s+steps)'
          confidence: 0.8
    suppress:
      # The other sense of "image": containers. Build/pull/push an image and run
      # it is ordinary tooling prose, and it is the dominant sense in the corpus.
      - '(?i)\b(docker|podman|container|base|sandbox|oci|registry|dockerfile)\b[^\n]{0,20}\bimage\b'
      - '(?i)\bimage\b[^\n]{0,20}\b(registry|repository|tag|digest|layer|pull|push|build)\b'
    rationale: >-
      Instructions rendered inside a bundled image or PDF are invisible to every text-based scanner —
      the file is an inert asset no rule reads — while a multimodal agent reads them at run time and
      acts on them. A skill that tells the agent to open such a file and carry out what it finds is
      routing its real directives around review (AST08 poor scanning, AST01 injection). The payload
      cannot be inspected; the instruction to fetch it can.
    fix: >-
      Keep every instruction the agent is meant to follow in reviewable text. Bundled images are fine as
      illustrations — do not tell the agent to read one and act on its contents, and never place
      commands, credentials or steps inside an image, a PDF or a QR code.
