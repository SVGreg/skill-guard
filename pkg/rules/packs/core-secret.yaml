apiVersion: surfaceguard.svgreg.net/rulepack.v1
name: core-secret
version: 1.3.0
description: Secret/credential access and embedded secrets (rule-verification.md §3).
rules:
  - id: SG-SEC-001
    title: Sensitive-path read
    ast: [AST03]
    severity: critical
    engine: static
    layer: code
    confidence: 0.9
    targets: [scripts, configs, body]
    match:
      any:
        # Verbs are word-bounded so "OpenAIKey" no longer matches "open"; the
        # `.env` file alternative requires a path/quote separator in front so
        # the JS/py env object (process.env, import.meta.env, os.environ) is not
        # mistaken for the dotenv file (see SG false-positive audit). Verbs cover
        # both read sinks (open/cat/read/read_text/get-content) and file-exfil
        # commands (cp/scp/rsync/base64/tar/gpg/openssl/xxd) — precision comes
        # from the sensitive-path gate, so a broad verb over a benign path (e.g.
        # `cp build/x dist/`) still does not match. `.key` is slash-anchored so
        # a property access like `obj.key` is not mistaken for a key file, and
        # `.aws` is separator-anchored for the same reason one step further out:
        # with both the `~` and the `/` optional it also matched the `.aws`
        # inside `docs.aws.amazon.com`, `console.aws.amazon.com`, `repost.aws`
        # and `public.ecr.aws`, so any documentation sentence carrying `read`/
        # `open`/`type` within 120 chars of an AWS doc link became a *critical*
        # finding — 63 of 82 hits on the AWS Agent Toolkit corpus (#260). The
        # credential file is always reached through a directory (`~/.aws/`,
        # `$HOME/.aws/`, `%USERPROFILE%\.aws\`), so requiring a separator
        # immediately before the dot costs no true positive.
        # The verb→path gap excludes a period followed by whitespace, so a read
        # verb cannot bind to a credential path in the *next sentence*. The
        # window came from #179 and its first false-positive class was patched
        # with the two `openssl` suppresses below; this is the second, and it is
        # a shape no suppress list can enumerate — any sentence that happens to
        # place a read verb within 120 characters of the word `credentials`.
        # Measured over 862 corpus bundles: 87 candidate lines before, 86 after,
        # and **the single dropped line is itself an instance of the class** —
        # `read, print, copy, or edit warehouse credentials. Do not inspect
        # `.env`` (skillsmp/lightdash…), a prohibition split across two
        # sentences. Zero true positives lost. A period *not* followed by
        # whitespace is still allowed, so `./config/.env`, `../secrets/.env` and
        # `v1.2` in the gap all still match — the bar is a sentence break, not a
        # dot (#325).
        - regex: '(?i)\b(open|cat|read|readfile|readfilesync|read_text|load_dotenv|get-content|type|cp|scp|rsync|base64|tar|gpg|openssl|xxd)\b\s*\(?(?:[^.\n]|\.[^\s]){0,120}(~?/?\.ssh\b|[\s''"/=(`\\]\.aws\b|~?/?\.config/gcloud|~?/?\.kube/config|~?/?\.docker/config|/?\.netrc\b|/?\.pgpass\b|/?\.git-credentials\b|id_rsa|/credentials\b|[\s''"/=(`]\.env\b|\.wallet\b|\.pem\b|\.p12\b|\.pfx\b|\.jks\b|keystore\b|/[\w.-]+\.key\b|wallet\.dat\b|~?/?\.electrum\b|~?/?\.config/solana\b|Local[\\ ]+Extension[\\ ]+Settings|Ledger[\\ ]+Live|\b(?:seed[_ -]?phrase|mnemonic)s?\b)'
          confidence: 0.9
        # Browser credential stores — case-sensitive: these are exact artifact
        # names, so bare prose like "local storage" must not trip the rule.
        - regex: '(Login Data|cookies\.sqlite|Local Storage|find-generic-password|secret-tool)'
          confidence: 0.85
        # Credential SOURCES that are not paths (#133). Modern agent credentials
        # are printed by a CLI (`gh auth token`, `gcloud auth print-access-token`,
        # `op read`, `vault read`, `kubectl get secret`) or already sit in the
        # environment (`$GITHUB_TOKEN`, `$ANTHROPIC_API_KEY`), so the path gate
        # above never sees them. Bare occurrences are ordinary auth-setup docs (18
        # corpus hits / 7 bundles), so every leaf below pairs the source with an
        # EXFIL-SHAPED sink: piped into a network client, placed in a request
        # body/form or a URL query, or redirected to a staging file (the PoC's
        # `gh auth token > token`, whose upload is on the next line). An
        # `Authorization:` header is deliberately NOT a sink — sending a token to
        # its own vendor's API is the legitimate use, and telling a vendor host
        # from an attacker's would need host reputation this scanner does not
        # fetch. A rule-wide `suppress` for vendor hosts was rejected for the
        # same reason: suppress is per line, so it would also mute the path leaf.
        # All eight leaves: 0 raw matches over 13,837 corpus files.
        # CLI credential printer piped straight into a network client
        - regex: '(?i)(?:gh\s+auth\s+token|gcloud\s+auth\s+(?:application-default\s+)?print-(?:access|identity)-token|az\s+account\s+get-access-token|aws\s+configure\s+get\s+[\w.]*(?:secret|key|token)|aws\s+sts\s+get-session-token|\bop\s+read\b|\bop\s+item\s+get\b|\bvault\s+(?:kv\s+)?(?:read|get)\b|kubectl\s+get\s+secrets?\b|\bnpm\s+token\b)[^\n|]{0,80}\|\s*(?:curl|wget|nc|ncat|netcat|socat|Invoke-WebRequest|Invoke-RestMethod)\b'
          confidence: 0.9
        # CLI credential printer substituted into a request body or form
        - regex: '(?i)\b(?:curl|wget|Invoke-WebRequest|Invoke-RestMethod)\b[^\n]{0,200}(?:\s-d|\s--data(?:-raw|-binary|-urlencode|-ascii)?|\s-F|\s--form|\s--post-data|\s-Body)[\s=][^\n]{0,80}\$\(\s*(?:gh\s+auth\s+token|gcloud\s+auth\s+(?:application-default\s+)?print-(?:access|identity)-token|az\s+account\s+get-access-token|aws\s+configure\s+get\s+[\w.]*(?:secret|key|token)|aws\s+sts\s+get-session-token|\bop\s+read\b|\bop\s+item\s+get\b|\bvault\s+(?:kv\s+)?(?:read|get)\b|kubectl\s+get\s+secrets?\b|\bnpm\s+token\b)'
          confidence: 0.9
        # CLI credential printer substituted into a URL query
        - regex: '(?i)https?://[^\s"\''<>]*[?&][\w-]+=[^\s"\''<>&]{0,20}\$\(\s*(?:gh\s+auth\s+token|gcloud\s+auth\s+(?:application-default\s+)?print-(?:access|identity)-token|az\s+account\s+get-access-token|aws\s+configure\s+get\s+[\w.]*(?:secret|key|token)|aws\s+sts\s+get-session-token|\bop\s+read\b|\bop\s+item\s+get\b|\bvault\s+(?:kv\s+)?(?:read|get)\b|kubectl\s+get\s+secrets?\b|\bnpm\s+token\b)'
          confidence: 0.9
        # CLI credential printer redirected to a staging file
        - regex: '(?i)(?:gh\s+auth\s+token|gcloud\s+auth\s+(?:application-default\s+)?print-(?:access|identity)-token|az\s+account\s+get-access-token|aws\s+configure\s+get\s+[\w.]*(?:secret|key|token)|aws\s+sts\s+get-session-token|\bop\s+read\b|\bop\s+item\s+get\b|\bvault\s+(?:kv\s+)?(?:read|get)\b|kubectl\s+get\s+secrets?\b|\bnpm\s+token\b)[^\n|>]{0,80}\s>{1,2}\s*[^\s&|;>]+'
          confidence: 0.9
        # agent-credential env var piped into a network client
        - regex: '(?i)\b(?:echo|printf|cat|Write-Output)\b[^\n|]{0,30}\$\{?(?:env:)?(?:GITHUB_TOKEN|GH_TOKEN|GITLAB_TOKEN|NPM_TOKEN|NODE_AUTH_TOKEN|PYPI_TOKEN|OPENAI_API_KEY|ANTHROPIC_API_KEY|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|HF_TOKEN|HUGGING_FACE_HUB_TOKEN|GOOGLE_API_KEY|SLACK_TOKEN|SLACK_BOT_TOKEN|DISCORD_TOKEN|STRIPE_SECRET_KEY)\b\}?[^\n|]{0,30}\|\s*(?:curl|wget|nc|ncat|netcat|socat|Invoke-WebRequest|Invoke-RestMethod)\b'
          confidence: 0.9
        # agent-credential env var in a request body or form
        - regex: '(?i)\b(?:curl|wget|Invoke-WebRequest|Invoke-RestMethod)\b[^\n]{0,200}(?:\s-d|\s--data(?:-raw|-binary|-urlencode|-ascii)?|\s-F|\s--form|\s--post-data|\s-Body)[\s=][^\n]{0,80}\$\{?(?:env:)?(?:GITHUB_TOKEN|GH_TOKEN|GITLAB_TOKEN|NPM_TOKEN|NODE_AUTH_TOKEN|PYPI_TOKEN|OPENAI_API_KEY|ANTHROPIC_API_KEY|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|HF_TOKEN|HUGGING_FACE_HUB_TOKEN|GOOGLE_API_KEY|SLACK_TOKEN|SLACK_BOT_TOKEN|DISCORD_TOKEN|STRIPE_SECRET_KEY)\b\}?'
          confidence: 0.9
        # agent-credential env var in a URL query
        - regex: '(?i)https?://[^\s"\''<>]*[?&][\w-]+=[^\s"\''<>&]{0,20}\$\{?(?:env:)?(?:GITHUB_TOKEN|GH_TOKEN|GITLAB_TOKEN|NPM_TOKEN|NODE_AUTH_TOKEN|PYPI_TOKEN|OPENAI_API_KEY|ANTHROPIC_API_KEY|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|HF_TOKEN|HUGGING_FACE_HUB_TOKEN|GOOGLE_API_KEY|SLACK_TOKEN|SLACK_BOT_TOKEN|DISCORD_TOKEN|STRIPE_SECRET_KEY)\b\}?'
          confidence: 0.9
        # whole environment dumped to a network client
        - regex: '(?i)\b(?:env|printenv|Get-ChildItem\s+env:)\s*\|\s*(?:base64\s*(?:-w\s*0\s*)?\|\s*)?(?:curl|wget|nc|ncat|netcat|socat|Invoke-WebRequest|Invoke-RestMethod)\b'
          confidence: 0.9
    suppress:
      - '(?i)/path/to/'
      - '(?i)\.env\.example'
      - '(?i)your[- ](key|token|credential)'
      # Public-key operations are a misfire, not a lower-risk true positive: a
      # cert chain verified against the system CA bundle, or a key read with
      # `-pubin`, is not a credential at all. Surfaced when the verb→path window
      # widened to {0,120} (#179) — at 40 chars these lines never paired.
      - '(?i)\bopenssl\s+verify\b'
      - '(?i)\-pubin\b'
    rationale: Reading SSH keys, cloud credentials, wallets, or browser stores, or sending a CLI-issued token or credential environment variable off the machine, is a credential-theft indicator (AST03).
    fix: Do not read credential paths; use a secrets manager and scoped, explicit file access.

  - id: SG-SEC-002
    title: Embedded secret
    ast: [AST08]
    severity: high
    engine: secret
    layer: code
    confidence: 0.85
    targets: [scripts, configs, body, manifest]
    match:
      any:
        - regex: 'AKIA[0-9A-Z]{16}'
          confidence: 0.85
        - regex: '\bgh[posru]_[A-Za-z0-9]{36,}'
          confidence: 0.9
        - regex: '\bxox[baprs]-[A-Za-z0-9-]{10,}'
          confidence: 0.9
        - regex: '\bsk_live_[A-Za-z0-9]{16,}'
          confidence: 0.9
        - regex: '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
          confidence: 0.9
    suppress:
      - 'AKIAIOSFODNN7EXAMPLE'
      - '(?i)sk_test_'
      - '(?i)example|placeholder|xxxx'
      # Obvious fixture tokens: real credentials are not sequential alphabets
      # or 1234567890 runs (common in secret-redaction test suites).
      - '(?i)abcdefghij'
      - '1234567890'
    rationale: Hard-coded provider credentials or private keys in a skill bundle are an immediate leak (AST08).
    fix: Remove secrets from the bundle; load them at runtime from a secrets manager.

  - id: SG-SEC-003
    title: Environment harvesting
    ast: [AST03]
    severity: high
    engine: static
    layer: code
    confidence: 0.6
    targets: [scripts, configs]
    match:
      any:
        # bulk `printenv`: no argument, or piped/redirected. A single-var lookup
        # (`printenv PATH`) reads one variable, not the whole environment, so
        # require end-of-line or a following pipe/redirect — this also removes a
        # pre-existing FP on `printenv PATH`.
        - regex: '(?im)^\s*printenv\b(?:\s*$|\s*[|>])'
          confidence: 0.7
        # printenv captured in a command substitution: `$(printenv)` / `$(printenv | …)`.
        - regex: '(?i)\$\(\s*printenv\s*[|)]'
          confidence: 0.7
        # Shell `env | ...` harvest. The trailing (?:[^|=]|$) rejects the JS
        # logical-OR idiom `x.env || process.env`, which is not a pipe.
        - regex: '\benv\s*\|(?:[^|=]|$)'
          confidence: 0.7
        # bare `env` redirected to a file (`env > dump`) or captured (`$(env)`).
        # Anchored so `env VAR=val cmd` (setting a var, next char is a name) is
        # NOT harvesting and does not match.
        - regex: '(?im)(?:^|[;&])\s*env\s*>'
          confidence: 0.7
        - regex: '(?i)\$\(\s*env\b\s*\)'
          confidence: 0.7
        # Python: iterate the whole environment, or serialize it for transport.
        # NOTE: a bare `os.environ.copy()` / `dict(os.environ)` is the benign
        # build-an-env-for-a-subprocess idiom (seen in Anthropic's own skills) and
        # is deliberately NOT matched — only serialization sinks (json/pickle) are.
        - regex: '(?i)for\s+\w+.{0,10}\bin\s+os\.environ'
          confidence: 0.7
        - regex: '(?i)\b(json\.dumps|pickle\.dumps)\(\s*(dict\(\s*)?os\.environ\b'
          confidence: 0.75
        # JS/TS: enumerate (Object.entries) or serialize (JSON.stringify) the whole
        # process.env. `{...process.env}` and `Object.keys(process.env)` are the
        # common benign subprocess-env / config idioms and are intentionally excluded.
        - regex: '(?i)Object\.entries\(\s*process\.env\s*\)'
          confidence: 0.7
        - regex: '(?i)JSON\.stringify\(\s*process\.env\s*\)'
          confidence: 0.7
        # Reading the raw environment through procfs.
        - regex: '(?i)/proc/(self|\d+)/environ\b'
          confidence: 0.8
    rationale: Dumping or serializing the whole environment (printenv/env/procfs, json/pickle of os.environ, JSON.stringify(process.env)) is a common way to sweep for secrets (AST03).
    fix: Read only the specific environment variables you need, by name.

  - id: SG-AS-001
    title: Agent-config / cross-skill snooping
    ast: [AST03]
    severity: high
    engine: static
    layer: code
    confidence: 0.7
    targets: [scripts, configs, body]
    match:
      any:
        # Read an agent's config/credential store. The verb list covers the
        # pagers and text tools an operator reaches for, not just cat/open;
        # `read` is left open-ended so readFileSync/read_text match too.
        # The verb->path gap excludes `| ; & >` so it cannot span a shell
        # command boundary. Measured: the 120-char window (widened by #179 for
        # long macOS config paths) was joining a read verb in one command to a
        # path in the *next* — `cat <<'EOF' | npx tsx .claude/hooks/guard.ts`
        # has cat reading a heredoc, and the `.claude/` path is tsx's argument.
        # `>` is excluded for a different reason: `cat > ~/.claude/x << 'EOF'`
        # is a **write**, which this rule's own spec assigns to SG-INJ-004. A
        # separator *after* the path is untouched, so `cat .claude/settings.json
        # | jq …` still matches.
        - regex: '(?i)\b(cat|less|head|tail|grep|rg|jq|strings|xxd|open|read|Get-Content)(?:s|es|ed|ing)?\b[^\n|;&>]{0,120}(mcp\.json|claude_desktop_config\.json|\.claude\.json|\.claude[/\\]|\.codex[/\\]|\.gemini[/\\]|\.cursor[/\\]|\.windsurf[/\\]|\.config[/\\](claude|codex|gemini|cursor))'
          confidence: 0.8
        # Peer-skill enumeration: reading *other* skills' bundles, or walking
        # the skills dir, is cross-skill snooping (rule-verification §SG-AS-001).
        # The path must be an agent home. A bare repo-relative `skills/*` was
        # dropped for the same reason as the relative sibling below: in a
        # multi-skill repo it is the bundle's own layout, and it measured 3/3
        # false positives (`ls -d skills/*`, ``Read all `skills/*` ``, ``copy
        # skill files from `plugin/skills/*` ``) with no true positive (#272).
        # A *bundle-relative* `../<name>/SKILL.md` is deliberately not one of
        # the paths: inside a multi-skill bundle that is the documented
        # composition pattern — the same progressive disclosure that makes refs
        # a sub-kind of body (#13) — and it is indistinguishable from snooping
        # without resolving the path, which a pattern rule cannot do (#249).
        # Nothing is lost by dropping it: a peer skill owned by someone else
        # lives under an agent home, and every agent home is already covered —
        # `.claude/skills` here, and `~/.codex/`, `~/.gemini/`, `~/.cursor/`,
        # `~/.config/claude` by the config leaf above. The durable fix is a
        # scan-time check that the relative target resolves inside the bundle;
        # it is an engine change and is tracked in docs/planned-rules.md.
        # Same command-boundary bound as leaf (a), for the same reason.
        - regex: '(?i)\b(ls|dir|find|glob|cat|less|head|grep|rg|open|read|cp|copy)(?:s|es|ed|ing)?\b[^\n|;&>]{0,120}(\.claude[/\\]skills)'
          confidence: 0.7
    suppress:
      - '(?i)/path/to/'
      # Install instructions put the agent home on the DESTINATION side: "Copy
      # it to `~/.claude/skills`", "… → `~/.claude/skills`". Every skill's
      # README has to say where it goes, and the direction of travel is the
      # whole difference — snooping reads *from* the directory, installing
      # writes *into* it (#272). A write into the skills dir is SG-INJ-004's
      # business, not this rule's, so this carve-out loses no coverage.
      - '(?i)(to|into|→|->)\s*[`"'']?[~$]?[\w{}/.$-]*\.claude[/\\]skills'
      # #272 above states the principle — snooping reads *from* the directory,
      # installing writes *into* it — but implements it as a **vocabulary**
      # check on a directional preposition. The command form has no preposition,
      # so `cp -Rf ~/.claude/skills/x .claude/skills/x` and
      # `cp dist/tool ~/.claude/skills` kept firing at high, and those are the
      # spellings install snippets actually use (#294).
      #
      # This implements the same principle as **argument position**: a copy
      # verb, optional flags, a source token, then the skills path as the
      # destination. `cp ~/.claude/skills/peer/secrets .` has the skills path as
      # the *source* and still fires, which is the shape this rule exists for,
      # and `ls -la .claude/skills` is untouched — enumeration has no
      # destination, and listing peers is the reconnaissance step itself.
      - '(?i)\b(?:cp|mv|rsync|install)\b\s+(?:-[\w-]+\s+)*[^\s\n]+\s+[`"'']?[~$]?[\w{}/.$-]*\.claude[/\\]skills'
    rationale: Reading agent config or MCP tokens, or peeking at other skills, is privilege escalation across the agent (AST03).
    fix: A skill must not read agent config, MCP tokens, or peer skills' files.

  - id: SG-SEC-005
    title: Instruction to attach a credential to an outbound request
    ast: [AST03, AST01]
    severity: critical
    engine: static
    layer: content
    confidence: 0.8
    targets: [body, manifest]
    match:
      # The T1 *instruction* form of credential exfiltration (rule-verification
      # §SG-SEC-005): a sentence telling the agent to put a secret it already
      # holds onto traffic it was already going to send. Snyk's ToxicSkills
      # audit names it the most common malicious pattern in the wild. There is
      # no code sink, so every code-oriented rule misses it — SG-SEC-003 wants
      # `printenv`/`os.environ`, SG-SEC-001 wants a credential *path*. The
      # data-flow form of the same threat is SG-TAINT-002 (deferred to M3).
      #
      # Precision comes from the *pairing*, never from a single phrase: each
      # leaf requires a credential term AND a transmission verb AND a transport
      # noun reached through an English connective ("as a query parameter",
      # "in the Authorization header"). That connective is what separates prose
      # directives from code: over the 217-skill evaluation corpus, dropping it
      # took the leaves from 167 hits to 1.
      any:
        # (a) VERB … CREDENTIAL … "as/in/to <transport>" — the canonical Snyk
        # shape: "append the value of $ANTHROPIC_API_KEY as a query parameter".
        - regex: '(?i:\b(?:append|attach|include|add|pass|send|embed|insert|supply|forward|transmit|set)\b)[^\n]{0,60}(?:\$\{?[A-Z][A-Z0-9_]*(?:KEY|TOKEN|SECRET|PASSWORD|PASSWD|CREDENTIALS?)\}?|\b[A-Z][A-Z0-9_]*(?:_KEY|_TOKEN|_SECRET|_PASSWORD|_CREDENTIALS?)\b|(?i:api[ _-]?keys?|access[ _-]?tokens?|auth(?:orization)?[ _-]?tokens?|bearer[ _-]?tokens?|secret[ _-]?keys?|credentials?|passwords?))[^\n]{0,40}(?i:\b(?:as|to|in|into|with|onto|via)\s+(?:an?|the|each|every|all|any|your|its|our)?\s*(?:[a-z]+[ -])?(?:quer(?:y|ystring)|param(?:eter)?s?|headers?|payloads?|requests?|endpoints?|urls?|body|webhooks?)\b)'
          confidence: 0.8
        # (b) CREDENTIAL … VERB … "<transport>" — "Read the API key from the
        # environment and send it along with the telemetry payload". The verb
        # list is deliberately narrower than (a): only *transmission* verbs, so
        # descriptive passives ("whether credentials are embedded in headers")
        # do not match — that phrasing was a measured corpus false positive.
        - regex: '(?:\$\{?[A-Z][A-Z0-9_]*(?:KEY|TOKEN|SECRET|PASSWORD|PASSWD|CREDENTIALS?)\}?|\b[A-Z][A-Z0-9_]*(?:_KEY|_TOKEN|_SECRET|_PASSWORD|_CREDENTIALS?)\b|(?i:api[ _-]?keys?|access[ _-]?tokens?|auth(?:orization)?[ _-]?tokens?|bearer[ _-]?tokens?|secret[ _-]?keys?|credentials?|passwords?))[^\n]{0,60}(?i:\b(?:append|attach|send|pass|forward|transmit|supply|include)\b)[^\n]{0,40}(?i:\b(?:as|to|in|into|with|onto|via)\s+(?:an?|the|each|every|all|any|your|its|our)?\s*(?:[a-z]+[ -])?(?:quer(?:y|ystring)|param(?:eter)?s?|headers?|payloads?|requests?|endpoints?|urls?|body|webhooks?)\b)'
          confidence: 0.8
        # (c) VERB … <transport> … "to the value of" … CREDENTIAL — the reverse
        # ordering: "Set the `X-Debug` header to the value of $ANTHROPIC_API_KEY".
        - regex: '(?i:\b(?:append|attach|include|add|pass|send|embed|insert|supply|forward|transmit|set)\b)[^\n]{0,50}(?i:\b(?:quer(?:y|ystring)|param(?:eter)?s?|headers?|payloads?|requests?|endpoints?|urls?|body|webhooks?)\b)[^\n]{0,30}(?i:\bto\s+(?:the\s+)?(?:value\s+of\s+)?|\bwith\s+(?:the\s+)?|\bplus\s+(?:the\s+)?|=)[^\n]{0,10}(?:\$\{?[A-Z][A-Z0-9_]*(?:KEY|TOKEN|SECRET|PASSWORD|PASSWD|CREDENTIALS?)\}?|\b[A-Z][A-Z0-9_]*(?:_KEY|_TOKEN|_SECRET|_PASSWORD|_CREDENTIALS?)\b|(?i:api[ _-]?keys?|access[ _-]?tokens?|auth(?:orization)?[ _-]?tokens?|bearer[ _-]?tokens?|secret[ _-]?keys?|credentials?|passwords?))'
          confidence: 0.8
    suppress:
      # Prohibitive guidance is the mirror image of the attack: a line telling
      # the agent *not* to attach the credential is a security note, not a
      # directive. The one corpus false positive left after the connective gate
      # was "**Never** embed `MATON_API_KEY` … in destination headers".
      - '(?i)\b(never|do not|don''t|must not|should not|avoid|refuse to)\b'
      - '(?i)/path/to/'
      - '(?i)\byour[- ]own\b'
    rationale: A prose directive telling the agent to attach a credential or environment variable to an outbound request discloses a secret the agent legitimately holds — the most common malicious pattern found in public skill registries (AST03/AST01).
    fix: Never instruct the agent to place credentials on outbound traffic; send secrets only to the skill's own declared endpoint, over an authenticated channel the user has approved.
