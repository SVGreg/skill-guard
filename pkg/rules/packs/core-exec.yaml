apiVersion: skillguard.net/rulepack.v1
name: core-exec
version: 1.0.0
description: Dangerous commands, code execution, privilege escalation, persistence (rule-verification.md §3).
rules:
  - id: SG-EXE-001
    title: Dynamic eval / exec
    ast: [AST01]
    severity: high
    engine: static
    layer: code
    confidence: 0.7
    targets: [scripts, configs]
    match:
      any:
        - regex: '(?i)\bsubprocess\.\w+\([^)]*shell\s*=\s*True'
          confidence: 0.7
        - regex: '(?i)\b(os\.system|os\.popen)\s*\('
          confidence: 0.7
        - regex: '(?:^|[^.\w])eval\s*\('
          confidence: 0.6
        - regex: '(?i)\bgetattr\s*\(\s*(os|builtins|__builtins__)\s*,'
          confidence: 0.85
        - regex: '(?i)\bchild_process\.(exec|execSync)\s*\('
          confidence: 0.7
        # Python's `exec` builtin. The rule is named "eval / exec" and
        # rule-verification's headline TP fixture is exec(base64.b64decode(…)),
        # but only `eval(` was ever matched — `exec(` slipped through entirely.
        # The leading [^.\w] also keeps JS `regex.exec(s)` / `pattern.exec(s)`
        # out while still catching the destructured
        # `const {exec} = require('child_process'); exec(cmd)` form that the
        # `child_process.exec(` leaf above cannot see.
        # No `\s*` before the paren, unlike the other leaves: `exec (` with a
        # space matches English as readily as code, and did — a corpus comment
        # reading "the string-form exec (xprintidle / gdbus)" was a measured
        # false positive. Both Python and JS write the call as `exec(`.
        - regex: '(?:^|[^.\w])exec\('
          confidence: 0.7
        # Import a module by name at runtime — the evasion primitive behind
        # __import__('os').system(…), which reaches a sink without naming it
        # (rule-verification AST9: reflective access is *more* suspicious).
        - regex: '\b__import__\s*\('
          confidence: 0.85
        # Direct exec/spawn syscall wrappers — os.system's lower-level siblings.
        - regex: '(?i)\bos\.(execv[pe]*|execl[pe]*|spawn[lv]p?e?)\s*\('
          confidence: 0.75
        # The classic shell upgrade in reverse-shell payloads.
        - regex: '(?i)\bpty\.spawn\s*\('
          confidence: 0.85
        # Node's vm module: compile and run a string in a fresh context.
        - regex: '(?i)\bvm\.runIn(This|New)?Context\s*\('
          confidence: 0.8
        # JS eval-equivalent: the Function constructor compiles a string body.
        # Case-SENSITIVE, deliberately: `new function(){…}` (lowercase) is the
        # ordinary anonymous-object idiom and has nothing to do with the
        # constructor. Under (?i) it matched, and a vendored echarts bundle in
        # the corpus proved it.
        - regex: '\bnew\s+Function\s*\('
          confidence: 0.7
        # PowerShell's eval. `irm <url> | iex` is the Windows counterpart of
        # curl|sh (SG-NET-002 only matches the POSIX pipe-to-shell form).
        # 0.9, not 0.8, for the reason documented on SG-DEP-008: this idiom
        # almost always carries a URL on the same line, `example` is a
        # docKeyword, and a `scripts` target has no +0.15 instruction bonus to
        # absorb the resulting -0.4. At 0.8 the canonical `irm … | iex` payload
        # silently failed its own test.
        - regex: '(?i)(\bInvoke-Expression\b|\|\s*iex\b)'
          confidence: 0.9
    suppress:
      - '(?i)ast\.literal_eval'
      # A *definition* named exec is not a call into an execution sink.
      # `\bexec\b` does not match exec_payload, so a helper wrapping a real
      # sink is still flagged by its own body.
      - '(?i)\b(function|def)\s+exec\b'
    rationale: Dynamic execution sinks enable arbitrary code execution, especially when fed untrusted input (AST01).
    fix: Avoid eval/exec/shell=True. Use explicit argument lists and validate all inputs.

  - id: SG-EXE-002
    title: Destructive filesystem operation
    ast: [AST01]
    severity: high
    engine: static
    layer: code
    confidence: 0.6
    targets: [scripts, configs, body]
    match:
      # Precision note (evaluation over 777 real skills): a destructive command
      # whose target is a *scoped path* (`/tmp/x`), an *ordinary variable*
      # (`$OUTDIR`, `fs.rmSync(tmpDir, …)`), or a *build dir* is benign cleanup and
      # is the overwhelming real-world case. Every leaf therefore requires a
      # genuinely **broad** target — filesystem root, the home directory, `$HOME`,
      # a top-level system directory, a drive root, or `os.homedir()`/`expanduser`
      # — never a bare variable or a named subpath. The earlier `rm -rf (/|$var|*)`
      # form matched any absolute path and any variable, which fired on ~92% of the
      # corpus (mostly `rm -rf "$VENV_DIR"` and `fs.rmSync(tmpDir,{recursive})`).
      any:
        # rm -rf targeting root / home / $HOME / a system dir / a drive root,
        # optionally with a /* wildcard, then a shell boundary — never a subpath.
        - regex: '(?i)\brm\s+(?:-[a-z-]+\s+)*-[a-z]*r[a-z]*f?[a-z]*\s+(?:-[a-z-]+\s+)*(?:sudo\s+)?["'']?(?:(?:/|~|\$\{?HOME\}?|%USERPROFILE%|[A-Za-z]:\\)(?:/\*?|\*)?|/(?:etc|usr|var|bin|sbin|lib|lib64|boot|sys|dev|proc|root|home|opt|Users|System|Applications)(?:/\*?)?)["'']?(?:\s|$|[;&|"''`])'
          confidence: 0.9
        - regex: '(?i)\bchmod\s+-R\s+777\b'
          confidence: 0.7
        - regex: '(?i)\b(mkfs|dd\s+of=/dev/)'
          confidence: 0.85
        # find rooted at exactly / or ~ or $HOME with -delete / -exec rm. A scoped
        # `find /var/log/app … -delete` (log rotation) or `find ./build … -delete`
        # is cleanup and does not match — the path token must be the root/home
        # itself (optionally `/*`), then whitespace.
        - regex: '(?i)\bfind\s+["'']?(/|~|\$\{?HOME\}?)(?:/\*)?["'']?\s[^\n|;]{0,80}(-delete\b|-exec(?:dir)?\s+rm\b)'
          confidence: 0.8
        # shutil.rmtree of a literal root/home or expanduser/Path.home()/HOME env —
        # not a variable and not a pathlib `dir / "x"` expression.
        - regex: '(?i)\bshutil\.rmtree\s*\(\s*(["''](/|~)["'']|[^)]{0,60}(expanduser|Path\.home\(\)|environ\s*\[\s*["'']HOME|environ\.get\(\s*["'']HOME))'
          confidence: 0.75
        # Python single-file removal of the home directory (single-file, so lower
        # confidence; still gated on an explicit home indicator, never bare `/`).
        - regex: '(?i)\bos\.(remove|unlink|removedirs)\s*\([^)]{0,60}(expanduser|Path\.home\(\)|environ\s*\[\s*["'']HOME|environ\.get\(\s*["'']HOME)'
          confidence: 0.6
        # Node fs.rm*/rmdir of a literal root/home or os.homedir()/env.HOME with
        # {recursive|force}, or rimraf() of the same — not `fs.rmSync(tmpDir, …)`.
        - regex: '(?i)(\bfs\.(rm|rmSync|rmdir|rmdirSync)\s*\(\s*(["''](/|~)[^"'']*["'']|[^)]{0,60}(homedir\(\)|env\.HOME|process\.env\.HOME|USERPROFILE))[^)]{0,60}(recursive|force)|(^|[^.\w])rimraf(\.sync)?\s*\(\s*(["''](/|~)|[^)]{0,40}(homedir\(\)|env\.HOME|USERPROFILE)))'
          confidence: 0.75
        # PowerShell Remove-Item -Recurse -Force on $HOME / drive root / ~ (target
        # in either position); a scoped `Remove-Item -LiteralPath $d …` does not match.
        - regex: '(?i)Remove-Item\b(?:[^\n]{0,80}(\$HOME|\$env:USERPROFILE|~|[A-Za-z]:\\|/["''\s])[^\n]{0,40}(-Recurse\b[^\n]{0,20}-Force\b|-Force\b[^\n]{0,20}-Recurse\b)|[^\n]{0,80}(-Recurse\b[^\n]{0,20}-Force\b|-Force\b[^\n]{0,20}-Recurse\b)[^\n]{0,40}(\$HOME|\$env:USERPROFILE|~|[A-Za-z]:\\|/["''\s]))'
          confidence: 0.8
        # Windows del /q /s or rmdir /s targeting a drive root, a top-level system
        # directory (C:\Users, C:\Windows), or the user profile — not a scoped path.
        - regex: '(?i)\b(del\s+/[qsf]\b[^\n]{0,25}/[qsf]\b|rmdir\s+/s\b)[^\n]{0,30}([A-Za-z]:\\(?:Users|Windows|Program Files|ProgramData)?(?:\s|$|["''])|%USERPROFILE%|%HOMEPATH%)'
          confidence: 0.75
        # Secure-erase / filesystem-signature wipe.
        - regex: '(?i)\b(shred\s+-[a-z]*|wipefs\b)'
          confidence: 0.75
        # Overwriting a raw block device destroys the disk.
        - regex: '(?i)>\s*/dev/(sd[a-z]|nvme\d|hd[a-z]|disk\d)'
          confidence: 0.85
    rationale: >-
      Destructive filesystem operations aimed at the filesystem root, the home directory (`~`/`$HOME`),
      a top-level system directory, or a raw block device can wipe user or system data (AST01). Deletion
      of a scoped path, a build/output directory, or a variable-named workspace dir is ordinary cleanup
      and is not flagged.
    fix: Scope deletions to the skill's own workspace; never target `/`, `~`, `$HOME`, a system dir, or a block device.

  - id: SG-EXE-003
    title: Privilege escalation
    ast: [AST01]
    severity: high
    engine: static
    layer: code
    confidence: 0.7
    targets: [scripts, configs]
    match:
      any:
        - regex: '(?i)>>?\s*[^\n]{0,20}(authorized_keys|/etc/sudoers)'
          confidence: 0.9
        - regex: '(?i)\bchmod\s+u\+s\b|\bsetcap\b'
          confidence: 0.85
        - regex: '(?im)^\s*sudo\s+\w'
          confidence: 0.6
    rationale: Adding SSH keys, editing sudoers, or setuid grants privilege escalation/persistence (AST01).
    fix: Avoid privilege escalation; if elevation is required, document the justification and scope.

  - id: SG-EXE-004
    title: Persistence mechanism
    ast: [AST01]
    severity: high
    engine: static
    layer: code
    confidence: 0.6
    targets: [scripts, configs]
    match:
      any:
        - regex: '(?i)\bcrontab\b|@reboot|/etc/cron'
          confidence: 0.75
        - regex: '(?i)>>?\s*[^\n]{0,20}(\.bashrc|\.zshrc|\.profile|\.bash_profile)'
          confidence: 0.75
        - regex: '(?i)(launchctl\s+load|systemctl\s+enable|/Library/LaunchAgents)'
          confidence: 0.7
    rationale: Cron/rc/launchd/systemd persistence keeps attacker code running across sessions (AST01).
    fix: Remove persistence mechanisms; skills should not install autostart hooks.

  - id: SG-CFG-001
    title: Bundled agent-hook config auto-executes commands
    ast: [AST02, AST01]
    severity: high
    engine: static
    layer: code
    confidence: 0.7
    targets: [configs]
    match:
      # A hook config is only dangerous when a lifecycle EVENT is wired to a
      # COMMAND handler, so both halves are required: the event name alone is
      # just a key, and "type": "command" alone appears in unrelated configs.
      # The first leaf carries the confidence — an `all` reports its first
      # branch's match (pkg/rules/rules.go), so the finding points at the event.
      all:
        # Quotes optional and `=` accepted: the same hook declaration appears in
        # YAML and TOML configs (Codex uses TOML), and pkg/skill classifies any
        # file under .claude/ as a config regardless of extension. Event names
        # stay case-sensitive — they are distinctive CamelCase tokens, and
        # lower-casing them would match prose like "stop:" in ordinary config.
        - regex: '(?m)(^|[{,\[\s])"?(PreToolUse|PostToolUse|SessionStart|SessionEnd|Stop|SubagentStop|UserPromptSubmit|Notification|PreCompact)"?\s*[:=]'
          confidence: 0.8
        - any:
            - regex: '(?i)"?\btype"?\s*[:=]\s*"?command\b'
            - regex: '(?i)"?\bcommand"?\s*[:=]\s*["'']?[^\s"'']'
    suppress:
      - '(?i)/path/to/'
    rationale: A bundled agent-hook config runs its command automatically on every matching lifecycle event, with no confirmation — installing code execution by shipping a config file (AST02/AST01). An empty matcher fires on every tool call and sees all tool input/output.
    fix: Do not ship lifecycle hooks in a skill bundle. If a hook is genuinely required, document it and let the user install it into their own settings deliberately.

  - id: SG-ROGUE-001
    title: Skill self-modification
    ast: [AST01]
    severity: high
    engine: static
    layer: code
    confidence: 0.8
    targets: [scripts, configs]
    match:
      any:
        - regex: '(?i)\bopen\(\s*[''"]SKILL\.md[''"]\s*,\s*[''"]a?w[''"]'
          confidence: 0.85
        - regex: '(?i)(writeFile|write_text)\([^)]*SKILL\.md'
          confidence: 0.85
    rationale: A skill rewriting its own SKILL.md/scripts at runtime can disable checks or install a backdoor (AST01).
    fix: Treat skill files as read-only at runtime; do not self-modify.
