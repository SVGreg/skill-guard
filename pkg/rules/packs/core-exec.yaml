apiVersion: skillguard.net/rulepack.v1
name: core-exec
version: 1.0.0
description: Dangerous commands, code execution, privilege escalation, persistence (rule-verification.md §3).
rules:
  - id: SG-EXE-001
    title: Dynamic eval / exec
    ast: [AST01]
    severity: high
    engine: static
    layer: code
    confidence: 0.7
    targets: [scripts, configs]
    match:
      any:
        - regex: '(?i)\bsubprocess\.\w+\([^)]*shell\s*=\s*True'
          confidence: 0.7
        - regex: '(?i)\b(os\.system|os\.popen)\s*\('
          confidence: 0.7
        - regex: '(?:^|[^.\w])eval\s*\('
          confidence: 0.6
        - regex: '(?i)\bgetattr\s*\(\s*(os|builtins|__builtins__)\s*,'
          confidence: 0.85
        - regex: '(?i)\bchild_process\.(exec|execSync)\s*\('
          confidence: 0.7
        # Python's `exec` builtin. The rule is named "eval / exec" and
        # rule-verification's headline TP fixture is exec(base64.b64decode(…)),
        # but only `eval(` was ever matched — `exec(` slipped through entirely.
        # The leading [^.\w] also keeps JS `regex.exec(s)` / `pattern.exec(s)`
        # out while still catching the destructured
        # `const {exec} = require('child_process'); exec(cmd)` form that the
        # `child_process.exec(` leaf above cannot see.
        # No `\s*` before the paren, unlike the other leaves: `exec (` with a
        # space matches English as readily as code, and did — a corpus comment
        # reading "the string-form exec (xprintidle / gdbus)" was a measured
        # false positive. Both Python and JS write the call as `exec(`.
        - regex: '(?:^|[^.\w])exec\('
          confidence: 0.7
        # Import a module by name at runtime — the evasion primitive behind
        # __import__('os').system(…), which reaches a sink without naming it
        # (rule-verification AST9: reflective access is *more* suspicious).
        - regex: '\b__import__\s*\('
          confidence: 0.85
        # Direct exec/spawn syscall wrappers — os.system's lower-level siblings.
        - regex: '(?i)\bos\.(execv[pe]*|execl[pe]*|spawn[lv]p?e?)\s*\('
          confidence: 0.75
        # The classic shell upgrade in reverse-shell payloads.
        - regex: '(?i)\bpty\.spawn\s*\('
          confidence: 0.85
        # Node's vm module: compile and run a string in a fresh context.
        - regex: '(?i)\bvm\.runIn(This|New)?Context\s*\('
          confidence: 0.8
        # JS eval-equivalent: the Function constructor compiles a string body.
        # Case-SENSITIVE, deliberately: `new function(){…}` (lowercase) is the
        # ordinary anonymous-object idiom and has nothing to do with the
        # constructor. Under (?i) it matched, and a vendored echarts bundle in
        # the corpus proved it.
        - regex: '\bnew\s+Function\s*\('
          confidence: 0.7
        # PowerShell's eval. `irm <url> | iex` is the Windows counterpart of
        # curl|sh (SG-NET-002 only matches the POSIX pipe-to-shell form).
        # 0.9, not 0.8, for the reason documented on SG-DEP-008: this idiom
        # almost always carries a URL on the same line, `example` is a
        # docKeyword, and a `scripts` target has no +0.15 instruction bonus to
        # absorb the resulting -0.4. At 0.8 the canonical `irm … | iex` payload
        # silently failed its own test.
        - regex: '(?i)(\bInvoke-Expression\b|\|\s*iex\b)'
          confidence: 0.9
    suppress:
      - '(?i)ast\.literal_eval'
      # A *definition* named exec is not a call into an execution sink.
      # `\bexec\b` does not match exec_payload, so a helper wrapping a real
      # sink is still flagged by its own body.
      - '(?i)\b(function|def)\s+exec\b'
    rationale: Dynamic execution sinks enable arbitrary code execution, especially when fed untrusted input (AST01).
    fix: Avoid eval/exec/shell=True. Use explicit argument lists and validate all inputs.

  - id: SG-EXE-002
    title: Destructive filesystem operation
    ast: [AST01]
    severity: high
    engine: static
    layer: code
    confidence: 0.6
    targets: [scripts, configs, body]
    match:
      # Precision note (evaluation over 777 real skills): a destructive command
      # whose target is a *scoped path* (`/tmp/x`), an *ordinary variable*
      # (`$OUTDIR`, `fs.rmSync(tmpDir, …)`), or a *build dir* is benign cleanup and
      # is the overwhelming real-world case. Every leaf therefore requires a
      # genuinely **broad** target — filesystem root, the home directory, `$HOME`,
      # a top-level system directory, a drive root, or `os.homedir()`/`expanduser`
      # — never a bare variable or a named subpath. The earlier `rm -rf (/|$var|*)`
      # form matched any absolute path and any variable, which fired on ~92% of the
      # corpus (mostly `rm -rf "$VENV_DIR"` and `fs.rmSync(tmpDir,{recursive})`).
      any:
        # rm -rf targeting root / home / $HOME / a system dir / a drive root,
        # optionally with a /* wildcard, then a shell boundary — never a subpath.
        - regex: '(?i)\brm\s+(?:-[a-z-]+\s+)*-[a-z]*r[a-z]*f?[a-z]*\s+(?:-[a-z-]+\s+)*(?:sudo\s+)?["'']?(?:(?:/|~|\$\{?HOME\}?|%USERPROFILE%|[A-Za-z]:\\)(?:/\*?|\*)?|/(?:etc|usr|var|bin|sbin|lib|lib64|boot|sys|dev|proc|root|home|opt|Users|System|Applications)(?:/\*?)?)["'']?(?:\s|$|[;&|"''`])'
          confidence: 0.9
        - regex: '(?i)\bchmod\s+-R\s+777\b'
          confidence: 0.7
        - regex: '(?i)\b(mkfs|dd\s+of=/dev/)'
          confidence: 0.85
        # find rooted at exactly / or ~ or $HOME with -delete / -exec rm. A scoped
        # `find /var/log/app … -delete` (log rotation) or `find ./build … -delete`
        # is cleanup and does not match — the path token must be the root/home
        # itself (optionally `/*`), then whitespace.
        - regex: '(?i)\bfind\s+["'']?(/|~|\$\{?HOME\}?)(?:/\*)?["'']?\s[^\n|;]{0,80}(-delete\b|-exec(?:dir)?\s+rm\b)'
          confidence: 0.8
        # shutil.rmtree of a literal root/home or expanduser/Path.home()/HOME env —
        # not a variable and not a pathlib `dir / "x"` expression.
        - regex: '(?i)\bshutil\.rmtree\s*\(\s*(["''](/|~)["'']|[^)]{0,60}(expanduser|Path\.home\(\)|environ\s*\[\s*["'']HOME|environ\.get\(\s*["'']HOME))'
          confidence: 0.75
        # Python single-file removal of the home directory (single-file, so lower
        # confidence; still gated on an explicit home indicator, never bare `/`).
        - regex: '(?i)\bos\.(remove|unlink|removedirs)\s*\([^)]{0,60}(expanduser|Path\.home\(\)|environ\s*\[\s*["'']HOME|environ\.get\(\s*["'']HOME)'
          confidence: 0.6
        # Node fs.rm*/rmdir of a literal root/home or os.homedir()/env.HOME with
        # {recursive|force}, or rimraf() of the same — not `fs.rmSync(tmpDir, …)`.
        - regex: '(?i)(\bfs\.(rm|rmSync|rmdir|rmdirSync)\s*\(\s*(["''](/|~)[^"'']*["'']|[^)]{0,60}(homedir\(\)|env\.HOME|process\.env\.HOME|USERPROFILE))[^)]{0,60}(recursive|force)|(^|[^.\w])rimraf(\.sync)?\s*\(\s*(["''](/|~)|[^)]{0,40}(homedir\(\)|env\.HOME|USERPROFILE)))'
          confidence: 0.75
        # PowerShell Remove-Item -Recurse -Force on $HOME / drive root / ~ (target
        # in either position); a scoped `Remove-Item -LiteralPath $d …` does not match.
        - regex: '(?i)Remove-Item\b(?:[^\n]{0,80}(\$HOME|\$env:USERPROFILE|~|[A-Za-z]:\\|/["''\s])[^\n]{0,40}(-Recurse\b[^\n]{0,20}-Force\b|-Force\b[^\n]{0,20}-Recurse\b)|[^\n]{0,80}(-Recurse\b[^\n]{0,20}-Force\b|-Force\b[^\n]{0,20}-Recurse\b)[^\n]{0,40}(\$HOME|\$env:USERPROFILE|~|[A-Za-z]:\\|/["''\s]))'
          confidence: 0.8
        # Windows del /q /s or rmdir /s targeting a drive root, a top-level system
        # directory (C:\Users, C:\Windows), or the user profile — not a scoped path.
        - regex: '(?i)\b(del\s+/[qsf]\b[^\n]{0,25}/[qsf]\b|rmdir\s+/s\b)[^\n]{0,30}([A-Za-z]:\\(?:Users|Windows|Program Files|ProgramData)?(?:\s|$|["''])|%USERPROFILE%|%HOMEPATH%)'
          confidence: 0.75
        # Secure-erase / filesystem-signature wipe.
        - regex: '(?i)\b(shred\s+-[a-z]*|wipefs\b)'
          confidence: 0.75
        # Overwriting a raw block device destroys the disk.
        - regex: '(?i)>\s*/dev/(sd[a-z]|nvme\d|hd[a-z]|disk\d)'
          confidence: 0.85
    rationale: >-
      Destructive filesystem operations aimed at the filesystem root, the home directory (`~`/`$HOME`),
      a top-level system directory, or a raw block device can wipe user or system data (AST01). Deletion
      of a scoped path, a build/output directory, or a variable-named workspace dir is ordinary cleanup
      and is not flagged.
    fix: Scope deletions to the skill's own workspace; never target `/`, `~`, `$HOME`, a system dir, or a block device.

  - id: SG-EXE-003
    title: Privilege escalation
    ast: [AST01]
    severity: high
    engine: static
    layer: code
    confidence: 0.7
    targets: [scripts, configs]
    match:
      any:
        - regex: '(?i)>>?\s*[^\n]{0,20}(authorized_keys|/etc/sudoers)'
          confidence: 0.9
        - regex: '(?i)\bchmod\s+u\+s\b|\bsetcap\b'
          confidence: 0.85
        - regex: '(?im)^\s*sudo\s+\w'
          confidence: 0.6
    rationale: Adding SSH keys, editing sudoers, or setuid grants privilege escalation/persistence (AST01).
    fix: Avoid privilege escalation; if elevation is required, document the justification and scope.

  - id: SG-EXE-004
    title: Persistence mechanism
    ast: [AST01]
    severity: high
    engine: static
    layer: code
    confidence: 0.6
    targets: [scripts, configs]
    match:
      any:
        - regex: '(?i)\bcrontab\b|@reboot|/etc/cron'
          confidence: 0.75
        - regex: '(?i)>>?\s*[^\n]{0,20}(\.bashrc|\.zshrc|\.profile|\.bash_profile)'
          confidence: 0.75
        - regex: '(?i)(launchctl\s+load|systemctl\s+enable|/Library/LaunchAgents)'
          confidence: 0.7
    rationale: Cron/rc/launchd/systemd persistence keeps attacker code running across sessions (AST01).
    fix: Remove persistence mechanisms; skills should not install autostart hooks.

  - id: SG-CFG-001
    title: Bundled agent-hook config auto-executes commands
    ast: [AST02, AST01]
    severity: high
    engine: static
    layer: code
    confidence: 0.7
    targets: [configs]
    match:
      # A hook config is only dangerous when a lifecycle EVENT is wired to a
      # COMMAND handler, so both halves are required: the event name alone is
      # just a key, and "type": "command" alone appears in unrelated configs.
      # The first leaf carries the confidence — an `all` reports its first
      # branch's match (pkg/rules/rules.go), so the finding points at the event.
      all:
        # Quotes optional and `=` accepted: the same hook declaration appears in
        # YAML and TOML configs (Codex uses TOML), and pkg/skill classifies any
        # file under .claude/ as a config regardless of extension. Event names
        # stay case-sensitive — they are distinctive CamelCase tokens, and
        # lower-casing them would match prose like "stop:" in ordinary config.
        - regex: '(?m)(^|[{,\[\s])"?(PreToolUse|PostToolUse|SessionStart|SessionEnd|Stop|SubagentStop|UserPromptSubmit|Notification|PreCompact)"?\s*[:=]'
          confidence: 0.8
        - any:
            - regex: '(?i)"?\btype"?\s*[:=]\s*"?command\b'
            - regex: '(?i)"?\bcommand"?\s*[:=]\s*["'']?[^\s"'']'
    suppress:
      - '(?i)/path/to/'
    rationale: A bundled agent-hook config runs its command automatically on every matching lifecycle event, with no confirmation — installing code execution by shipping a config file (AST02/AST01). An empty matcher fires on every tool call and sees all tool input/output.
    fix: Do not ship lifecycle hooks in a skill bundle. If a hook is genuinely required, document it and let the user install it into their own settings deliberately.

  - id: SG-ROGUE-001
    title: Skill self-modification
    ast: [AST01]
    severity: high
    engine: static
    layer: code
    confidence: 0.8
    targets: [scripts, configs]
    match:
      # Corpus audit (777 bundles) reshaped this rule. The lesson: **a write
      # whose target is a `SKILL.md` is, in the wild, overwhelmingly a skill
      # *generator*, not a skill modifying itself.** Every one of the 8 real
      # corpus writes is authoring — `evolver`/`capability-evolver` emitting
      # `path.join(outDir, 'SKILL.md')`, a test helper writing fixture bundles,
      # `extract-skill.sh` heredoc-ing a freshly extracted skill. So the bare
      # filename is not the signal; what separates self-modification from
      # authoring is *where the content comes from* and *which bundle is
      # overwritten*.
      any:
        # (a) Remote fetch → overwrite a SKILL.md. The sharp one, and the only
        #     shape with a real corpus true positive
        #     (`security-sentinel-skill/install.sh:105`:
        #     `$DOWNLOAD_CMD "$GITHUB_RAW_URL/SKILL.md" > "$INSTALL_DIR/SKILL.md"`).
        #     A generator writes *constructed* content; pulling the replacement
        #     from the network means the bytes the agent ends up running were
        #     never reviewed — and, because `attest` seals the walk, never
        #     signed either, so `verify` still passes over the swapped file.
        #     Corpus: 1 hit, a genuine detection.
        #
        #     The `\s>` is load-bearing: it demands a real redirect. Without the
        #     leading whitespace this matches `skills/<skill-name>/SKILL.md`,
        #     where `>` merely closes a placeholder — 10 corpus lines of
        #     ordinary prose and comments. Requiring the path to follow the `>`
        #     with no intervening space likewise keeps Markdown blockquotes
        #     ("> ... the SKILL.md file ...") out.
        #     The filename slot also accepts a bundled `references/*.md`. Those
        #     became scanned instruction surface in #99 and are inside the Merkle
        #     root, so overwriting one after install swaps instructions past both
        #     review and signing — the same escape as the SKILL.md case, and the
        #     last shape issue #105 listed. Corpus prevalence: 0/777.
        - regex: '(?i)(https?://|\bcurl\b|\bwget\b|\bfetch\b|\$\{?DOWNLOAD)[^\n]{0,120}\s>\s*[''"]?[^''"`\s|<>*]*(SKILL\.md|references?/[^''"`\s|<>*]*\.md)'
          confidence: 0.85
        # (b) Python open-for-write of the *running bundle's own* SKILL.md. The
        #     path prefix is restricted to self-referential forms (bare, `./`,
        #     `__file__`'s dir) rather than any prefix: `open(f"{outdir}/SKILL.md",
        #     "w")` is a generator, and with 0 corpus hits for the Python shape
        #     there is no evidence to justify the looser form.
        - regex: '(?i)\bopen\(\s*[''"](\./)?SKILL\.md[''"]\s*,\s*[''"]a?w[''"]'
          confidence: 0.85
        - regex: '(?i)\bopen\(\s*os\.path\.join\(\s*os\.path\.dirname\(\s*__file__\s*\)\s*,\s*[''"]SKILL\.md[''"]\s*\)\s*,\s*[''"]a?w[''"]'
          confidence: 0.85
        # (c) pathlib form, where the filename precedes the write call and so was
        #     unreachable by the old `write_text\(` leaf. Same self-referential
        #     restriction.
        - regex: '(?i)\bPath\(\s*[''"](\./)?SKILL\.md[''"]\s*\)\s*\.write_text\('
          confidence: 0.85
        # (d) JS/Node write of a SKILL.md. Kept, but see the suppress list: this
        #     leaf produced 2 of 2 corpus findings and both were authoring, so
        #     the destination vocabulary below is what makes it usable at all.
        #
        #     `[^)\n]*` — NOT `[^)]*`. The gap must not cross a newline, because
        #     `suppress` is evaluated against the single line the match *starts*
        #     on (`rules.go`: `r.suppressed(lineText(text, m.start))`). With
        #     `[^)]*` the leaf spanned lines, so a pretty-printed
        #     `writeFileSync(\n  path.join(skillPath, 'SKILL.md'), …)` anchored
        #     the match on the bare `writeFileSync(` line and every carve-out
        #     below silently missed it — exactly what happened to
        #     `clawhub/feishu-evolver-wrapper/skills_monitor.js:122`. Any leaf
        #     whose gap can cross a newline makes this rule's suppress list
        #     unreliable.
        - regex: '(?i)(writeFile(Sync)?|write_text)\([^)\n]*SKILL\.md'
          confidence: 0.85
    suppress:
      # A path with a `skills/<name>/SKILL.md` segment is a write *into a skills
      # collection* — i.e. authoring some other skill — never a bundle
      # overwriting its own root SKILL.md. This one line covers both existing
      # corpus false positives (`plugin-src/skills/${skill.name}/SKILL.md`,
      # `plugin/skills/slm-orphan/SKILL.md`) and the `skills/<skill-name>/`
      # prose, and it is the principle rather than a list of spellings. The real
      # true positive (`… > "$INSTALL_DIR/SKILL.md"`) has no such segment.
      - '(?i)skills/[^/\s''"]*/SKILL\.md'
      # The authoring register, taken verbatim from the corpus audit. A skill
      # that *builds* skills writes SKILL.md into a directory it names — a temp
      # dir, an output dir, a per-skill path it just constructed. That is a
      # legitimate and common thing to ship (`evolver`, `capability-evolver`,
      # `skill-creator`, `self-improving-agent`), and it is the opposite of a
      # bundle rewriting itself. Matching `path.join(<dir-var>, 'SKILL.md')`
      # covers every JS corpus hit; the vocabulary list covers the rest.
      - '(?i)\b(path\.)?join\(\s*[''"]?(tmp|tmpdir|temp|dir|out_?dir|outputdir|target_?dir|dest_?dir|skill_?path|plugin_?src|build_?dir)\b'
      - '(?i)\b(plugin-src|__tests__|__fixtures__|/fixtures?/|\bdist/|\bbuild/|\bgenerated/|node_modules)'
      # A path with a *variable skill name* segment is another skill's path
      # being constructed, not this bundle's own file.
      - '(?i)skills/(\$\{|\$[A-Za-z_]|<|\{\{|%s|\+)'
    rationale: >-
      A skill rewriting its own SKILL.md/scripts at runtime can disable checks or install a backdoor
      (AST01). The sharpest form pulls the replacement over the network, so the instructions the agent
      finally runs were never reviewed — and, because signing hashes the files as walked, never signed.
    fix: >-
      Treat skill files as read-only at runtime; do not self-modify. Generating a *different* skill into
      an output directory is fine — overwriting the running bundle's own SKILL.md is not.

  - id: SG-EXE-006
    title: Dynamic-context command executed before the model sees the skill
    ast: [AST01, AST03]
    severity: critical
    engine: static
    layer: code
    confidence: 0.9
    targets: [manifest, body, refs]
    match:
      # Claude Code renders a *dynamic-context* span in skill markdown by running
      # the command at PREPROCESSING time and splicing its stdout into the prompt
      # — "each dynamic context command executes immediately (before Claude sees
      # anything) … This is preprocessing, not something Claude executes."
      #
      # That is why this is not "a command in a skill" (SG-EXE-001/SG-NET-002 model
      # a command the agent MAY choose to run; SG-INJ-011 one a HUMAN is talked
      # into running). This one runs unconditionally, before any model turn, so
      # every permission prompt and model-level defence is bypassed by
      # construction — SG-CFG-001's guarantee relocated from .claude/settings.json
      # into the skill's own body. Hence `critical` for bytes that would be `high`
      # as a mere suggestion.
      #
      # PRECISION IS THE WHOLE JOB, and the first gate is documented rather than
      # tuned. The corpus has 25 `!` + backtick occurrences across 18 files, but
      # only 2 are real dynamic-context commands (`git branch --show-current`,
      # `gh issue list …` — both benign inspection); the other 23 are prose
      # punctuation (``!`, ` ``, ``!`)` ``, a Rust `!` discussed in backticks). A
      # bare span leaf would be ~92% FP. The vendor docs specify the inline form
      # runs ONLY when `!` is at line-start or directly after whitespace (`KEY=!`
      # + backtick is inert literal text), and that anchor alone takes the corpus
      # from 23 to 4. Then gate on the command's EFFECT; the dangerous variants
      # measure 0 across the corpus, and read-only git/gh queries carry no sink so
      # they need no suppress.
      #
      # BOTH DOCUMENTED SYNTAXES ARE COVERED. Matching only the inline form would
      # be bypassed by the vendor's own alternative — a fenced block opened with
      # ```! is the multi-line form and scans clean without leaf (b).
      any:
        # (a) inline: !`<command with an effect>` — anchored at line-start or
        #     after whitespace, per the documented recognition rule.
        - regex: '(?m)(?:^|\s)!`[^`\n]{0,200}(?:curl|wget|\bnc\s|https?://|gh\s+auth\s+token|aws\s+configure\s+get|op\s+read|gcloud\s+auth\s+print-access-token|\$\{?[A-Za-z_]*(?:TOKEN|API_?KEY|SECRET|PASSWORD)|~/\.(?:aws|ssh)|\.env\b|\|\s*(?:sh|bash|zsh)\b|\beval\b|base64\s+(?:-d|--decode)|\brm\s+-rf|\bsudo\b|\bchmod\s+\+x|\btee\b|>\s*[~/.\w])[^`\n]{0,200}`'
          confidence: 0.9
        # (b) fenced: a block opened with ```! — the documented multi-line form.
        #     `[^`]` keeps the window inside the block so the closing fence is
        #     never crossed (RE2 has no backreference to match the opener).
        - regex: '(?m)^\s*```!\s*\n[^`]{0,600}(?:curl|wget|\bnc\s|https?://|gh\s+auth\s+token|aws\s+configure\s+get|op\s+read|gcloud\s+auth\s+print-access-token|\$\{?[A-Za-z_]*(?:TOKEN|API_?KEY|SECRET|PASSWORD)|~/\.(?:aws|ssh)|\.env\b|\|\s*(?:sh|bash|zsh)\b|\beval\b|base64\s+(?:-d|--decode)|\brm\s+-rf|\bsudo\b|\bchmod\s+\+x|\btee\b|>\s*[~/.\w])'
          confidence: 0.9
    rationale: >-
      A dynamic-context span (inline !`cmd`, or a ```! fenced block) is executed by the agent
      runtime at preprocessing time — before the model sees the skill and before any permission
      prompt — and its stdout is spliced into the prompt. A span carrying a network sink,
      credential source, exec chain, redirect, or destructive verb is therefore a guaranteed
      execution, not a suggested one (AST01/AST03).
    fix: >-
      Do not put commands with side effects in a dynamic-context span; use it only for read-only
      state a reviewer can predict (`git branch --show-current`, `gh issue list`). Operators can
      disable the feature centrally with "disableSkillShellExecution": true, which replaces every
      command with a placeholder — note that bundled and managed skills are unaffected by it.
