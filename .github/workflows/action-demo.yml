# Exercises the composite action in this repo against the bundled fixtures.
#
# The scan runs against a binary built from the checkout (version:
# preinstalled), not the latest release, so a change to the emitter is tested
# by the same commit that makes it.
name: action

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: gate + SARIF artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }

      - name: Build surfaceguard from this checkout
        run: |
          go build -o "$RUNNER_TEMP/bin/surfaceguard" ./cmd/surfaceguard
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The malicious fixture must fail the gate. continue-on-error keeps the
      # job alive so the next step can assert that it *did* fail — an action
      # that silently passed here would be the bug worth catching.
      - name: Scan the malicious fixture
        id: malicious
        continue-on-error: true
        uses: ./
        with:
          path: testdata/malicious
          output: malicious.sarif
          version: preinstalled
          # Not uploaded: these are 65 deliberate fixture findings, and putting
          # them in this repo's own Security tab would bury real alerts. The
          # upload path is exercised by the code-scanning job below.
          upload-sarif: "false"

      - name: The gate must have failed, and the SARIF must still exist
        run: |
          test "${{ steps.malicious.outcome }}" = "failure" \
            || { echo "the malicious fixture did not fail the gate"; exit 1; }
          test "${{ steps.malicious.outputs.exit-code }}" = "1" \
            || { echo "expected exit 1, got ${{ steps.malicious.outputs.exit-code }}"; exit 1; }
          test "${{ steps.malicious.outputs.verdict }}" = "fail" \
            || { echo "expected verdict fail, got '${{ steps.malicious.outputs.verdict }}'"; exit 1; }
          test -s malicious.sarif || { echo "no SARIF was written"; exit 1; }
          python3 - <<'PY'
          import json
          log = json.load(open("malicious.sarif"))
          run = log["runs"][0]
          assert log["version"] == "2.1.0", log["version"]
          assert run["results"], "no results in the SARIF log"
          assert len(run["taxonomies"][0]["taxa"]) == 10
          print(f"{len(run['results'])} results, verdict {run['properties']['verdict']}")
          PY

      - name: Scan the benign fixture
        id: benign
        uses: ./
        with:
          path: testdata/benign
          output: benign.sarif
          version: preinstalled
          upload-sarif: "false"

      - name: The benign fixture must pass the gate
        run: |
          test "${{ steps.benign.outputs.exit-code }}" = "0" \
            || { echo "benign fixture did not pass"; exit 1; }
          test "${{ steps.benign.outputs.verdict }}" = "pass" \
            || { echo "expected verdict pass, got '${{ steps.benign.outputs.verdict }}'"; exit 1; }
          test "${{ steps.benign.outputs.output-file }}" = "benign.sarif" \
            || { echo "output-file was '${{ steps.benign.outputs.output-file }}'"; exit 1; }

      # A repository of skills: the action pointed at a folder that is not
      # itself a skill must discover every bundle below it and fail on the
      # worst one, in one SARIF run whose URIs stay relative to that folder.
      - name: Scan a folder holding several skills
        id: multi
        continue-on-error: true
        uses: ./
        with:
          path: testdata
          output: multi.sarif
          version: preinstalled
          upload-sarif: "false"

      - name: The folder scan must fail on its worst skill, in one run
        run: |
          test "${{ steps.multi.outputs.exit-code }}" = "1" \
            || { echo "expected exit 1, got ${{ steps.multi.outputs.exit-code }}"; exit 1; }
          test "${{ steps.multi.outputs.verdict }}" = "fail" \
            || { echo "expected verdict fail, got '${{ steps.multi.outputs.verdict }}'"; exit 1; }
          python3 - <<'PY'
          import json, os
          log = json.load(open("multi.sarif"))
          assert len(log["runs"]) == 1, "a folder scan must be one run"
          run = log["runs"][0]
          props = run["properties"]
          assert props["mode"] == "multi" and props["bundles"] == 2, props
          for r in run["results"]:
              for loc in r.get("locations", []):
                  uri = loc["physicalLocation"]["artifactLocation"]["uri"]
                  assert uri.startswith(("benign/", "malicious/")), uri
                  assert os.path.exists(os.path.join("testdata", uri)), uri
          print(f"{props['bundles']} bundles, {len(run['results'])} results, verdict {props['verdict']}")
          PY

      - name: The folder-scan SARIF validates against the vendored schema
        env:
          SG_SARIF_FILE: ${{ github.workspace }}/multi.sarif
        run: go test ./pkg/report -run TestExternalSARIFValidates -count=1 -v

      # The action's own guardrails. Each of these used to reach surfaceguard and
      # come back as a usage error, which reads like the scanner's fault rather
      # than the workflow's.
      - name: A bad format is rejected before anything runs
        id: badformat
        continue-on-error: true
        uses: ./
        with:
          path: testdata/benign
          format: yaml
          version: preinstalled
          upload-sarif: "false"

      - name: A missing path names the fix
        id: nopath
        continue-on-error: true
        uses: ./
        with:
          path: testdata/does-not-exist
          version: preinstalled
          upload-sarif: "false"

      - name: Both guardrails must have failed the step
        run: |
          test "${{ steps.badformat.outcome }}" = "failure" \
            || { echo "format: yaml was accepted"; exit 1; }
          test "${{ steps.nopath.outcome }}" = "failure" \
            || { echo "a nonexistent path was accepted"; exit 1; }

  # The path a marketplace consumer actually takes: install a published release
  # through the action rather than building from the checkout. This is what
  # catches a broken install.sh, a renamed release asset, or a checksum that no
  # longer matches — none of which the preinstalled jobs above can see.
  released-binary:
    name: install ${{ matrix.version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both OSes, because the asset name carries the platform and a broken
        # asset name only breaks one of them; both version modes, because
        # resolving an exact tag and resolving "the newest release" are
        # different code paths in the action.
        #
        # The pinned tag must be >= v0.4.0: that is the first release whose
        # assets carry the current binary name, and install.sh no longer carries
        # a fallback for anything older.
        os: [ubuntu-latest, macos-latest]
        version: [v0.4.1, latest]
    steps:
      - uses: actions/checkout@v4

      - name: Scan with the released binary
        id: released
        uses: ./
        with:
          path: testdata/benign
          output: released.sarif
          version: ${{ matrix.version }}
          category: surfaceguard:demo-${{ matrix.version }}
          upload-sarif: "false"

      - name: The released binary must have produced a clean scan
        env:
          WANT_VERSION: ${{ matrix.version }}
        run: |
          test "${{ steps.released.outputs.exit-code }}" = "0" \
            || { echo "the released binary did not pass the benign fixture"; exit 1; }
          test "${{ steps.released.outputs.verdict }}" = "pass" \
            || { echo "expected verdict pass, got '${{ steps.released.outputs.verdict }}'"; exit 1; }
          test -s released.sarif || { echo "no SARIF was written"; exit 1; }
          installed=$(surfaceguard version | head -1)
          echo "$installed"
          # An exact tag must install exactly that; "latest" only has to install
          # something, since the newest release moves.
          case "$WANT_VERSION" in
            v*)
              echo "$installed" | grep -q "${WANT_VERSION#v}" \
                || { echo "wanted $WANT_VERSION, got: $installed"; exit 1; }
              ;;
          esac

  code-scanning:
    name: upload to code scanning
    # Manual only: this uploads fixture findings to this repo's Security tab,
    # which is useful as a demo but noise as a default.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: Build surfaceguard from this checkout
        run: |
          go build -o "$RUNNER_TEMP/bin/surfaceguard" ./cmd/surfaceguard
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: ./
        continue-on-error: true
        with:
          path: testdata/malicious
          output: surfaceguard.sarif
          version: preinstalled
